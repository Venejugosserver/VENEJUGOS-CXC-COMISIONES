<script>
(function(){
  const $ = id => document.getElementById(id);
  const { f0, f1, fp } = VJ;
  let DS = DATASET_BASE;
  let DS_TODO = DATASET_BASE;      /* dataset completo del mes; DS es la vista del rango elegido */
  const RANGO = { desde: 1, hasta: 31, completo: true };
  const dd2 = n => String(n).padStart(2, "0");
  const diaN = f => parseInt(String(f).split("/")[0], 10);
  const isoDe = (ds, d) => `${ds.anio}-${dd2(ds.mesNum)}-${dd2(d)}`;
  const txtDe = (ds, d) => `${dd2(d)}/${dd2(ds.mesNum)}/${ds.anio}`;
  /* configuración del panel con el corte del rango: los cálculos se hacen al "Hasta" elegido */
  const leerCfg = () => Object.assign({}, VJ.leerLocal("vj_config") || {}, RANGO.completo ? {} : { corte: txtDe(DS_TODO, RANGO.hasta) });
  function aplicarRango() {
    const dias = DS_TODO.dias.map(diaN), ultimo = Math.max.apply(null, dias.length ? dias : [1]);
    RANGO.desde = Math.max(1, Math.min(RANGO.desde, ultimo));
    RANGO.hasta = Math.max(RANGO.desde, Math.min(RANGO.hasta, ultimo));
    RANGO.completo = RANGO.desde === 1 && RANGO.hasta === ultimo;
    if (RANGO.completo) { DS = DS_TODO; }
    else {
      /* con un rango parcial los montos se calculan con las ventas del rango; la matriz oficial solo
         aplica si el rango va del 1 al día de las ventas con que se armó */
      const r = DS_TODO.r.filter(x => { const d = diaN(DS_TODO.dias[x[4]]); return d >= RANGO.desde && d <= RANGO.hasta; });
      DS = Object.assign({}, DS_TODO, { r, rangoDesde: RANGO.desde, rangoHasta: RANGO.hasta });
    }
    window.VJ_DS = DS;
    $("fDesde").min = $("fHasta").min = isoDe(DS_TODO, 1);
    $("fDesde").max = $("fHasta").max = isoDe(DS_TODO, ultimo);
    $("fDesde").value = isoDe(DS_TODO, RANGO.desde);
    $("fHasta").value = isoDe(DS_TODO, RANGO.hasta);
    const ofi = VJ.oficialDe(DS), OF = VJ.oficialDe(Object.assign({}, DS_TODO, { rangoDesde: 1, rangoHasta: 99 })) || null;
    const mx = (function () { try { return window.OFI_CARGADA || null; } catch (e) { return null; } })();
    const vh = mx && mx.ventasHasta ? parseInt(String(mx.ventasHasta).slice(0, 2), 10) : null;
    $("notaRango").innerHTML = `Rango: <b>${dd2(RANGO.desde)}/${dd2(DS_TODO.mesNum)} al ${dd2(RANGO.hasta)}/${dd2(DS_TODO.mesNum)}</b> · ` +
      (ofi ? `activación con los montos oficiales de la matriz de la coordinación (ventas al ${ofi.ventasHasta || ofi.corte})`
           : (mx && mx.mes === DS_TODO.mes && vh && RANGO.desde === 1 && RANGO.hasta !== vh
              ? `activación calculada con las ventas ${VJ.maestroIdx() ? "según el maestro general (su base, más los clientes fuera de la base a los que les vendió; NCTESO restando; sucursales)" : "y las reglas de la matriz (vendedor que factura, NCTESO restando, sucursales)"}. La matriz oficial es de las ventas al ${mx.ventasHasta}: <a href="#" id="verMatriz">ver sus montos (1 al ${dd2(vh)})</a>`
              : RANGO.completo ? `activación calculada con las ventas del mes${VJ.maestroIdx() ? ", según el maestro general" : ""}` : `activación y kilos calculados solo con las ventas de ese rango${VJ.maestroIdx() ? ", según el maestro general" : ""}`));
    const vm = document.getElementById("verMatriz");
    if (vm) vm.addEventListener("click", e => { e.preventDefault(); RANGO.desde = 1; RANGO.hasta = vh; aplicarRango(); guardarEstado(); listaVendedores(); pintar(); });
  }
  function rangoDesdeInputs() {
    const a = $("fDesde").value, b = $("fHasta").value;
    if (a) RANGO.desde = parseInt(a.slice(8, 10), 10);
    if (b) RANGO.hasta = parseInt(b.slice(8, 10), 10);
    if (RANGO.desde > RANGO.hasta) { const x = RANGO.desde; RANGO.desde = RANGO.hasta; RANGO.hasta = x; }
  }

  const leer = VJ.leerLocal;
  const sem = v => v == null ? "gris" : v >= 100 ? "ok" : v >= 70 ? "med" : "mal";
  const color = v => v == null ? "#98A2C0" : v >= 100 ? "#128C5A" : v >= 70 ? "#E08A00" : "#E5142B";
  const medida = () => $("fMedida").value;
  const inverso = () => medida() === "inv";
  /* Una sola medida por vista, la que se elige arriba, y el color siempre según el cumplimiento:
     - cumplimiento = activados ÷ meta (puede pasar de 100 %: el asesor superó su meta)
     - activación   = activados ÷ cartera
     - brecha       = lo que falta para la meta, en % de la meta */
  const val = o => medida() === "inv" ? (o.pendiente != null ? o.pendiente : null)
                 : medida() === "act" ? (o.pctAct != null ? o.pctAct : (o.pctCartera != null ? o.pctCartera : null))
                 : (o.pct != null ? o.pct : null);
  const semV = o => { const c = o.pct; return sem(c); };
  const colorV = o => color(o.pct);
  const rotulo = () => medida() === "inv" ? "brecha pendiente" : medida() === "act" ? "activación sobre la cartera" : "cumplimiento de la meta";

  function dona(pct, tam, col){
    const p = Math.max(0, Math.min(100, pct || 0)), R = (tam/2) - 6, C = 2 * Math.PI * R;
    const color = () => col || "#1740C4";
    return `<svg class="dona" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="#E8EDFB" stroke-width="9"></circle>
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="${color(pct)}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${tam/2} ${tam/2})"></circle>
      <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${tam*0.23}" fill="${color(pct)}">${pct == null ? "—" : Math.round(pct) + "%"}</text>
    </svg>`;
  }

  function tarjetaSup(S){
    const total = S.equipo.reduce((a,v)=>a+v.cartera,0) || 1;
    const cintas = S.equipo.map(v => `<span style="width:${100*v.cartera/total}%;background:${colorV(v)}"></span>`).join("");
    return `<div class="tarjeta c6">
      <div class="sup-cab">
        ${dona(val(S), 74, colorV(S))}
        <div>
          <p class="nom">${S.supervisor}</p>
          <p class="cifra et2"><span class="et-n"><i>Meta</i>${f0(S.meta)}</span><span class="et-sep">/</span><span class="et-n"><i>Activados</i>${f0(S.activados)}</span>
            <small>cumplimiento ${fp(S.pct)} · cartera ${f0(S.cartera)}, activación ${fp(S.pctAct)} · falta ${f0(S.faltan)} · ${f1(S.porDia)} clientes/día</small></p>
        </div>
      </div>
      <div class="cintas">${cintas}</div>
      <div class="eq-cab"><span></span><span>Asesor</span><span>Meta</span><span>Activados</span><span>Falta</span><span>${medida() === "inv" ? "Brecha" : medida() === "act" ? "Activ." : "Cumpl."}</span></div>
      <ul class="equipo cols">
        ${S.equipo.map(v => `<li class="${v.pct != null && v.pct < 70 ? "bajo" : ""}">
          <span class="punto" style="background:${colorV(v)}"></span>
          <span class="quien">${v.vendedor}</span>
          <span class="col">${f0(v.meta)}</span>
          <span class="col">${f0(v.activados)}</span>
          <span class="col f">${f0(v.faltan)}</span>
          <span class="tanto t-${semV(v)}">${val(v) == null ? "—" : fp(val(v))}</span>
        </li>`).join("")}
      </ul>
    </div>`;
  }

  function tablaVend(M){
    const v = M.vendedores.slice().sort((a,b)=> (b.pct||0)-(a.pct||0));
    return `<div class="tarjeta c12">
      <h3>Detalle por vendedor</h3>
      <p class="sub">Categoría ${M.categoria === "TODAS" ? "todas las categorías" : M.categoria} · target ${M.target}% sobre los clientes que cada vendedor tiene en el maestro único · activaciones por día calculadas sobre ${M.dias.restantes} días hábiles restantes</p>
      <div class="tw"><table>
        <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Cartera asignada</th><th>Clientes atendidos</th><th>Meta</th><th>Activados</th><th>% activación</th><th>Cumplimiento de meta</th><th>Clientes por activar</th><th>Activaciones por día</th></tr></thead>
        <tbody>${v.map(x=>`<tr>
          <td><b>${x.vendedor}</b></td><td>${x.supervisor}</td>
          <td>${f0(x.cartera)}</td><td>${f0(x.atendida)}</td><td>${f0(x.meta)}</td><td>${f0(x.activados)}</td>
          <td>${x.pctAct == null ? "—" : fp(x.pctAct)}</td>
          <td><span class="pill ${sem(x.pct)}">${x.pct == null ? "—" : fp(x.pct)}</span></td>
          <td>${x.faltan === 0 ? "cubierto" : f0(x.faltan)}</td>
          <td>${x.faltan === 0 ? "—" : f1(x.porDia)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td>—</td><td>${f0(M.total.cartera)}</td><td>—</td><td>${f0(M.total.meta)}</td><td>${f0(M.total.activados)}</td>
        <td>${fp(M.total.pctAct)}</td><td><span class="pill ${sem(M.total.pct)}">${fp(M.total.pct)}</span></td>
        <td>${f0(M.total.faltan)}</td><td>${f1(M.total.porDia)}</td></tr></tfoot>
      </table></div>
    </div>`;
  }

  function alertas(M){
    const flojos = M.vendedores.filter(v => v.pct != null && v.pct < 70).sort((a,b)=> b.faltan - a.faltan);
    const cats = M.porCategoria.filter(c => c.faltan > 0).sort((a,b)=> b.faltan - a.faltan);
    const lista = (arr, vacio, fila) => arr.length
      ? `<ul class="equipo">${arr.slice(0,8).map(fila).join("")}</ul>`
      : `<p class="notas" style="margin-top:6px">${vacio}</p>`;

    return `
    <div class="tarjeta c6" style="border-left:5px solid var(--rojo)">
      <h3>Alerta de vendedores</h3>
      <p class="sub">${flojos.length} de ${M.vendedores.length} vendedores por debajo de 70% del target en ${M.categoria === "TODAS" ? "activación general" : M.categoria}</p>
      ${lista(flojos, "Ningún vendedor por debajo del umbral en esta categoría.", v => `<li class="bajo">
        <span class="punto" style="background:${color(v.pct)}"></span>
        <span class="quien">${v.vendedor}<br><span style="font-weight:500;color:var(--gris);font-size:.74rem">${v.supervisor}</span></span>
        <span class="par">faltan <b>${f0(v.faltan)}</b> · <b>${f1(v.porDia)}</b>/día</span>
        <span class="tanto t-${sem(v.pct)}">${val(v) == null ? "—" : fp(val(v))}</span></li>`)}
    </div>

    <div class="tarjeta c6" style="border-left:5px solid var(--ambar)">
      <h3>Alerta de activación</h3>
      <p class="sub">Categorías por debajo del target${M.vendedor === "TODOS" ? "" : " para " + M.vendedor} · corte ${M.dias.corte} · ${M.dias.transcurridos} de ${M.dias.habiles} días hábiles · ${M.dias.restantes} restantes</p>
      ${lista(cats, "Todas las categorías alcanzan su target.", c => `<li class="${c.pct < 70 ? "bajo" : ""}">
        <span class="punto" style="background:${color(c.pct)}"></span>
        <span class="quien">${c.cat}<br><span style="font-weight:500;color:var(--gris);font-size:.74rem">target ${c.target}% · activación ${fp(c.pctCartera)}</span></span>
        <span class="par">faltan <b>${f0(c.faltan)}</b> · <b>${f1(c.porDia)}</b>/día</span>
        <span class="tanto t-${sem(c.pct)}">${val(c) == null ? "—" : fp(val(c))}</span></li>`)}
    </div>`;
  }

  function tablaCat(M){
    return `<div class="tarjeta c12">
      <h3>Activación por categoría${M.vendedor === "TODOS" ? "" : " · " + M.vendedor}</h3>
      <p class="sub">Cartera Nestlé: <b>${f0(M.bases.nestle)}</b> clientes · cada categoría se mide sobre su base del maestro: A&amp;B o Confites (Chocolates y Galletas) · la proyección indica cuántos clientes deben activarse por día hábil para llegar a la meta</p>
      <div class="tw"><table>
        <thead><tr><th>Categoría</th><th>Cartera</th><th>Target</th><th>% activación</th><th>Meta</th><th>Activados</th><th>${inverso() ? "Brecha pendiente" : "Cumplimiento"}</th><th>Clientes por activar</th><th>Activaciones por día</th></tr></thead>
        <tbody>${M.porCategoria.map(c=>`<tr>
          <td><b>${c.cat}</b></td><td>${f0(c.cartera)}</td><td>${c.target}%</td>
          <td><span class="pill ${sem(c.pctCartera >= c.target ? 100 : 100*c.pctCartera/(c.target||100))}">${fp(c.pctCartera)}</span></td>
          <td>${f0(c.meta)}</td><td>${f0(c.activados)}</td>
          <td><span class="pill ${sem(c.pct)}">${c.pct == null ? "—" : fp(val(c))}</span></td>
          <td>${c.faltan === 0 ? "cubierto" : f0(c.faltan)}</td>
          <td>${c.faltan === 0 ? "—" : f1(c.porDia)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="notas" style="margin-top:10px">Bases del maestro general: cartera Nestlé = clientes con estatus Nestlé activo; base A&amp;B y base Confites = clientes con esa bandera. Meta = base × target (redondeada). Las ventas de asesores sin cartera en el maestro quedan fuera de este cuadro.</p>
    </div>`;
  }

  let FILTRO_TXT = "", FILTRO_EST = "todos";
  let MAE = null, MAE_ORIGEN = "";
  const opcCli = cat => ({ categoria: cat || $("fCat").value, vendedor: $("fVend").value, supervisor: $("fSup").value });

  /* Maestro único de clientes (RIF, razón social, asesor y día de visita; sin teléfonos).
     Orden: maestro.pub.json del repositorio -> copia de este navegador -> copia incluida en este archivo. */
  async function cargarMaestro(){
    MAE = null; MAE_ORIGEN = "";
    try {
      const rp = await VJ.traerJSON("maestro.pub.json", 2);
      if (rp.json && Array.isArray(rp.json.clientes) && rp.json.clientes.length) { MAE = rp.json.clientes; MAE_ORIGEN = "repositorio" + (rp.json.publicado ? ", publicado el " + rp.json.publicado : ""); return; }
    } catch (e) { /* sigue con la copia local */ }
    const loc = VJ.leerLocal("vj_maestro");
    if (loc && Array.isArray(loc.clientes) && loc.clientes.length) { MAE = loc.clientes; MAE_ORIGEN = "copia de este navegador"; return; }
    try {
      const emb = document.getElementById("maestroEmb");
      const j = emb ? JSON.parse(emb.textContent) : null;
      if (j && Array.isArray(j.clientes) && j.clientes.length) { MAE = j.clientes; MAE_ORIGEN = "copia incluida en este archivo" + (j.publicado ? " (" + j.publicado + ")" : ""); }
    } catch (e) { /* sin maestro */ }
  }

  function tablaClientes(){
    const C = VJ.clientesMae(DS, MAE, opcCli());
    const txt = FILTRO_TXT.toLowerCase();
    const catTxt = C.categoria === "TODAS" ? "todas las categorías" : C.categoria;
    const filas = C.lista
      .filter(c => FILTRO_EST === "act" ? c.activado : FILTRO_EST === "no" ? !c.activado : true)
      .filter(c => !txt || (c.nombre + " " + c.codigo + " " + c.ruc + " " + c.vendedor).toLowerCase().includes(txt));
    const totalKg = filas.reduce((a,c)=>a+c.kilos,0);
    const tot = C.usaMaestro ? C.maestro : C.atendidos;
    const pAct = tot ? 100 * C.activados / tot : 0, noAct = tot - C.activados;

    const grupos = new Map();
    C.lista.forEach(c => { const g = grupos.get(c.vendedor) || { v: c.vendedor, s: c.supervisor, n: 0, a: 0 }; g.n++; if (c.activado) g.a++; grupos.set(c.vendedor, g); });
    const porVend = Array.from(grupos.values()).sort((a,b)=> (b.n - b.a) - (a.n - a.a));
    const barra = (a,n) => `<div style="display:flex;height:10px;min-width:150px;border-radius:99px;overflow:hidden;background:var(--azul-claro)"><span style="width:${n ? 100*a/n : 0}%;background:var(--azul-med)"></span><span style="width:${n ? 100*(n-a)/n : 0}%;background:var(--rojo)"></span></div>`;

    const aviso = C.usaMaestro ? "" : `<div class="tarjeta c12" style="border-left:5px solid var(--rojo);margin-bottom:14px"><p class="notas"><b style="color:var(--rojo)">No se encontró el maestro de clientes.</b> Sin él solo pueden listarse los clientes que tuvieron movimiento; los no activados no aparecen. En el panel administrativo cargue el maestro y pulse <b>Publicar ventas y maestro</b> (se escribe <code>maestro.pub.json</code>).</p></div>`;

    return `${aviso}
    <div class="tarjeta kpi c3"><p class="rot">${C.usaMaestro ? "Maestro único de clientes" : "Clientes con movimiento"}</p><p class="val">${f0(tot)}</p>
      <div style="margin-top:10px">${barra(C.activados, tot)}</div>
      <p class="pie">${catTxt}${C.vendedor === "TODOS" ? "" : " · " + C.vendedor}</p></div>
    <div class="tarjeta kpi c3"><p class="rot">Activados</p><p class="val" style="color:var(--azul-med)">${f0(C.activados)}</p>
      <p class="pie"><b>${fp(pAct)}</b> de la base · ${C.reglaMaestro ? "compra de la categoría mayor a cero" : "factura del asesor mayor a cero"}</p></div>
    <div class="tarjeta kpi rojo c3"><p class="rot">No activados</p><p class="val">${f0(noAct)}</p>
      <p class="pie"><b>${fp(100 - pAct)}</b> del maestro · sin compra en ${catTxt}</p></div>
    <div class="tarjeta kpi ambar c3"><p class="rot">${C.reglaMaestro ? "Activados fuera de la base" : "Activados con observación del maestro"}</p><p class="val">${f0(C.reglaMaestro ? C.fueraMaestro : C.conObservacion || 0)}</p>
      <p class="pie">${C.reglaMaestro ? "Sí cuentan: compraron productos Nestlé al asesor aunque no estén en su base (sin la bandera de la categoría, sin estatus Nestlé activo o fuera del maestro)" : "Cuentan igual (el asesor les facturó)."}</p></div>

    <div class="tarjeta c12">
      <h3>Activados y no activados por vendedor · ${catTxt}</h3>
      <p class="sub">${C.reglaMaestro ? "Según el maestro general: activado = cliente de la base del asesor (estatus Nestlé activo y bandera A&amp;B o Confites) que compró la categoría, se la haya facturado quien sea, y también el cliente fuera de su base al que él le vendió productos Nestlé · no activado = cliente de su base sin esa compra. Siempre monto mayor a cero, restando devoluciones NCTESO" : "Activado = cliente al que el asesor le facturó la categoría (monto mayor a cero, restando devoluciones NCTESO) · no activado = cliente de su maestro sin esa compra"}. Ordenado por clientes no activados.</p>
      <div class="tw" style="max-height:340px;overflow:auto"><table>
        <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Clientes del maestro</th><th>Activados</th><th>No activados</th><th>% activado</th><th>Activados / no activados</th></tr></thead>
        <tbody>${porVend.map(g=>`<tr><td><b>${g.v}</b></td><td>${g.s}</td><td>${f0(g.n)}</td><td>${f0(g.a)}</td><td>${f0(g.n-g.a)}</td><td>${fp(g.n ? 100*g.a/g.n : 0)}</td><td>${barra(g.a,g.n)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td></td><td>${f0(tot)}</td><td>${f0(C.activados)}</td><td>${f0(noAct)}</td><td>${fp(pAct)}</td><td>${barra(C.activados, tot)}</td></tr></tfoot>
      </table></div>
    </div>

    <div class="tarjeta c12">
      <h3>Clientes activados y no activados · ${catTxt}${C.vendedor === "TODOS" ? "" : " · " + C.vendedor}</h3>
      <p class="sub">Activado = cliente al que el asesor le facturó la categoría con monto mayor a cero, restando devoluciones NCTESO; cada sucursal cuenta aparte. ${f0(C.activados)} activados y ${f0(C.noActivados)} no activados.${MAE_ORIGEN && C.usaMaestro ? " Maestro: " + MAE_ORIGEN + "." : ""}</p>
      <div class="buscador no-print">
        <input id="qCli" type="text" placeholder="Buscar por cliente, RIF, código o vendedor" value="${FILTRO_TXT.replace(/"/g,"&quot;")}">
        <select id="qEst" style="padding:8px 10px;border:1px solid var(--linea);border-radius:10px;font:inherit;font-size:.84rem">
          <option value="todos" ${FILTRO_EST==="todos"?"selected":""}>Activados y no activados</option>
          <option value="act" ${FILTRO_EST==="act"?"selected":""}>Solo activados</option>
          <option value="no" ${FILTRO_EST==="no"?"selected":""}>Solo no activados</option>
        </select>
        <button class="btn azul" id="bCsv">Descargar CSV de esta vista</button>
        <button class="btn linea" id="bCsvTodo">Descargar CSV completo</button>
        <span style="font-size:.78rem;color:var(--gris)">${f0(filas.length)} filas · ${f1(totalKg)} kg</span>
      </div>
      <div class="tw" style="max-height:620px;overflow:auto">
        <table>
          <thead><tr><th>Cliente</th><th>RIF</th><th>Código</th><th>Vendedor</th><th>Supervisor</th><th>Ruta</th><th>Día de visita</th><th>Monto</th><th>Kilos</th><th>Facturas</th><th>Última compra</th><th>Estado</th><th>Validación del maestro</th></tr></thead>
          <tbody>${filas.slice(0,2000).map(c=>`<tr>
            <td><b>${c.nombre}</b></td><td>${c.ruc || "—"}</td><td>${c.codigo || "—"}</td><td>${c.vendedor}</td><td>${c.supervisor}</td><td>${c.ruta || "—"}</td><td>${c.diaVisita || "—"}</td>
            <td>${VJ.fu(c.monto)}</td><td>${f1(c.kilos)}</td><td>${f0(c.facturas)}</td><td>${c.ultima}</td>
            <td><span class="pill ${c.activado ? "ok" : "mal"}">${c.activado ? "activado" : "no activado"}</span></td>
            <td>${c.nota ? `<span style="color:#B26A00;font-weight:700">${c.nota}</span>` : (c.activado && C.usaMaestro ? '<span style="color:#128C5A;font-weight:800">✓</span>' : "—")}</td></tr>`).join("")}</tbody>
        </table>
      </div>
      ${filas.length > 2000 ? `<p class="notas" style="margin-top:8px">Se muestran las primeras 2.000 filas de ${f0(filas.length)}; el CSV las trae todas.</p>` : ""}
    </div>`;
  }

  function csv(filas, cab){
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
    return "\ufeff" + [cab.join(";")].concat(filas.map(f => f.map(esc).join(";"))).join("\r\n");
  }

  function bajar(nombre, texto){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
    a.download = nombre; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }

  const filaCsv = (c, cat) => [cat, c.ruc, c.codigo, c.nombre, c.vendedor, c.supervisor, c.diaVisita || "",
    c.monto.toFixed(2).replace(".", ","), c.kilos.toFixed(2).replace(".", ","), c.facturas, c.ultima, c.activado ? "ACTIVADO" : "NO ACTIVADO"];
  const CAB_CSV = ["Categoria","RIF","Codigo","Cliente","Vendedor","Supervisor","Dia de visita","Monto","Kilos","Facturas","Ultima compra","Estado"];

  function csvVista(){
    const C = VJ.clientesMae(DS, MAE, opcCli());
    const filas = C.lista.filter(c => FILTRO_EST === "act" ? c.activado : FILTRO_EST === "no" ? !c.activado : true).map(c => filaCsv(c, C.categoria));
    bajar(`clientes_${FILTRO_EST}_${C.categoria}_${C.vendedor}.csv`.replace(/\s+/g,"_"), csv(filas, CAB_CSV));
  }

  function csvTodo(){
    const filas = [];
    Object.keys(VJ.TARGETS).forEach(cat => {
      const C = VJ.clientesMae(DS, MAE, opcCli(cat));
      C.lista.forEach(c => filas.push(filaCsv(c, cat)));
    });
    bajar("clientes_activados_y_no_activados_todas_las_categorias.csv", csv(filas, CAB_CSV));
  }

  function pintarClientes(){
    $("clientes").innerHTML = tablaClientes();
    $("qCli").addEventListener("input", e => { FILTRO_TXT = e.target.value; const pos = e.target.selectionStart; pintarClientes(); const n = $("qCli"); n.focus(); n.setSelectionRange(pos, pos); });
    $("qEst").addEventListener("change", e => { FILTRO_EST = e.target.value; pintarClientes(); });
    $("bCsv").addEventListener("click", csvVista);
    $("bCsvTodo").addEventListener("click", csvTodo);
  }

  function tablaRolling(){
    const cfg = leerCfg();
    const R = VJ.rolling(DS, { corte: cfg.corte, supervisor: $("fSup").value });
    const celdas = v => `
      <td>${f1(v.cuota)}</td>
      <td>${f1(v.ventaDia)}</td>
      <td>${f1(v.venta)}</td>
      <td><span class="pill ${sem(v.cumpl)}">${v.cumpl == null ? "—" : fp(v.cumpl)}</span></td>
      <td>${f1(v.necesidad)}</td>
      <td>${f1(v.proyeccion)}</td>
      <td><span class="pill ${sem(v.cumplProy)}">${v.cumplProy == null ? "—" : fp(v.cumplProy)}</span></td>`;

    const filas = R.supervisores.map(S => `
      ${S.equipo.map(v => `<tr><td>${v.vendedor}</td>${celdas(v)}</tr>`).join("")}
      <tr class="grupo"><td>${S.supervisor}</td>${celdas(S)}</tr>`).join("");

    return `
    <div class="tarjeta kpi c3"><p class="rot">Tiempo transcurrido</p><p class="val">${fp(R.dias.tt)}</p>
      <div class="barrita"><span class="med" style="width:${R.dias.tt}%"></span></div>
      <p class="pie">${R.dias.transcurridos} de ${R.dias.habiles} días hábiles al ${R.dias.corte}<br><b>${R.dias.restantes}</b> días por facturar</p></div>
    <div class="tarjeta kpi rojo c3"><p class="rot">Kilos del mes vs cuota</p><p class="val">${f1(R.total.venta)}<small>kg</small></p>
      <div class="barrita"><span class="${sem(R.total.cumpl)}" style="width:${Math.min(100, R.total.cumpl||0)}%"></span></div>
      <p class="pie">Cuota <b>${f1(R.total.cuota)} kg</b> · cumplimiento <b>${fp(R.total.cumpl)}</b><br>Faltan <b>${f1(R.total.falta)} kg</b></p></div>
    <div class="tarjeta kpi ambar c3"><p class="rot">Necesidad diaria</p><p class="val">${f1(R.total.necesidad)}<small>kg/día</small></p>
      <p class="pie">Para cerrar la cuota en los ${R.dias.restantes} días hábiles restantes<br>Venta del día ${R.dias.corte}: <b>${f1(R.total.ventaDia)} kg</b></p></div>
    <div class="tarjeta kpi verde c3"><p class="rot">Proyección al cierre</p><p class="val">${f1(R.total.proyeccion)}<small>kg</small></p>
      <div class="barrita"><span class="${sem(R.total.cumplProy)}" style="width:${Math.min(100, R.total.cumplProy||0)}%"></span></div>
      <p class="pie">Cumplimiento proyectado <b>${fp(R.total.cumplProy)}</b><br>Al ritmo del ${fp(R.dias.tt)} de tiempo transcurrido</p></div>

    <div class="tarjeta c12">
      <h3>Rolling Nestlé en kilos por asesor</h3>
      <p class="sub">Corte ${R.dias.corte} · la proyección divide los kilos del mes entre el ${fp(R.dias.tt)} de tiempo transcurrido; la necesidad diaria reparte lo que falta entre los ${R.dias.restantes} días hábiles que quedan</p>
      <div class="tw"><table>
        <thead><tr><th>Vendedor</th><th>Cuota del mes (kg)</th><th>Venta diaria</th><th>Venta mes</th><th>% cumpl.</th><th>Necesidad diaria kg</th><th>Proyección kg</th><th>% cump. proyect.</th></tr></thead>
        <tbody>${filas}</tbody>
        <tfoot><tr class="granTotal"><td>TOTAL VENEJUGOS</td>${celdas(R.total)}</tr></tfoot>
      </table></div>
      <div class="buscador no-print" style="margin-top:12px;margin-bottom:0">
        <button class="btn azul" id="bCsvRoll">Descargar CSV del rolling</button>
      </div>
    </div>`;
  }

  function csvRolling(){
    const cfg = leerCfg();
    const R = VJ.rolling(DS, { corte: cfg.corte, supervisor: $("fSup").value });
    const n = v => v.toFixed(1).replace(".", ",");
    const filas = [];
    R.supervisores.forEach(S => {
      S.equipo.forEach(v => filas.push(["ASESOR", v.supervisor, v.vendedor, n(v.cuota), n(v.ventaDia), n(v.venta),
        v.cumpl == null ? "" : n(v.cumpl), n(v.necesidad), n(v.proyeccion), v.cumplProy == null ? "" : n(v.cumplProy)]));
      filas.push(["SUPERVISOR", S.supervisor, "", n(S.cuota), n(S.ventaDia), n(S.venta),
        S.cumpl == null ? "" : n(S.cumpl), n(S.necesidad), n(S.proyeccion), S.cumplProy == null ? "" : n(S.cumplProy)]);
    });
    filas.push(["TOTAL", "VENEJUGOS", "", n(R.total.cuota), n(R.total.ventaDia), n(R.total.venta),
      n(R.total.cumpl), n(R.total.necesidad), n(R.total.proyeccion), n(R.total.cumplProy)]);
    bajar(`rolling_nestle_kilos_${R.dias.corte.replace(/\//g,"-")}.csv`,
      csv(filas, ["Nivel","Supervisor","Vendedor","Cuota kg","Venta diaria","Venta mes","% cumpl","Necesidad diaria kg","Proyeccion kg","% cump proyect"]));
  }

  function pintarRolling(){
    $("rolling").innerHTML = tablaRolling();
    $("bCsvRoll").addEventListener("click", csvRolling);
  }

  function tablaSemanal(){
    const cfg = leerCfg();
    const W = VJ.semanal(DS, { categoria: $("fCat").value, corte: cfg.corte, supervisor: $("fSup").value, maestro: MAE });
    const offS = (() => { const s0 = VJ.semanasDelMes(DS.anio, DS.mesNum)[0]; return s0 && s0.lunes < 1 ? 0 : 1; })();
    const cab = W.semanas.map(s => `<th>S${s.n - 1 + offS}<br><small style="font-weight:600">${s.desde}–${s.hasta}</small></th>`).join("");

    const celda = (sm, valor, meta, deficit, fmt) => {
      if (!sm.transcurrida) return `<td class="sem fuera">—</td>`;
      const clase = deficit > 0 ? "mal" : "ok";
      return `<td class="sem"><span class="pill ${clase}">${deficit > 0 ? "−" + fmt(deficit) : "al día"}</span>
        <small>${fmt(valor)} de ${fmt(meta)}</small></td>`;
    };

    const bloque = (titulo, sub, campoVal, campoMeta, campoDef, fmt, totalFila) => `
      <div class="tarjeta c12">
        <h3>${titulo}</h3>
        <p class="sub">${sub}</p>
        <div class="tw"><table>
          <thead><tr><th>Vendedor</th><th>Supervisor</th>${cab}<th>Déficit acumulado</th></tr></thead>
          <tbody>${W.filas.map(v => `<tr>
            <td><b>${v.vendedor}</b></td><td>${v.supervisor}</td>
            ${v.semanas.map(sm => celda(sm, sm[campoVal], sm[campoMeta], sm[campoDef], fmt)).join("")}
            <td><span class="pill ${v[campoDef === "deficitKg" ? "incumpleKg" : "incumpleCli"] ? "mal" : "ok"}">${fmt(v[campoDef === "deficitKg" ? "deficitKg" : "deficitCli"])}</span></td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td>—</td>${W.semanas.map(() => "<td>—</td>").join("")}<td>${fmt(totalFila)}</td></tr></tfoot>
        </table></div>
      </div>`;

    const enDef = W.enDeficit;
    const aviso = `
      <div class="tarjeta aviso c12">
        <h3>Aviso de incumplimiento semanal</h3>
        <p class="sub">Corte ${W.corte} · semana S${W.semActual + offS} · la cuota del mes se reparte entre ${W.total} semanas según sus días hábiles</p>
        ${enDef.length === 0
          ? `<p class="notas">Ningún asesor arrastra déficit acumulado en esta semana.</p>`
          : `<p style="font-size:.86rem;margin:0 0 8px"><b>${enDef.length}</b> de ${W.filas.length} asesores están por debajo de la meta acumulada a la semana S${W.semActual + offS}.</p>
             <div>${enDef.map(v => `<span class="chip ${v.incumpleKg && v.incumpleCli ? "mal" : "med"}">${v.vendedor}: ${v.incumpleKg ? f1(v.deficitKg) + " kg" : ""}${v.incumpleKg && v.incumpleCli ? " · " : ""}${v.incumpleCli ? f0(v.deficitCli) + " clientes" : ""}</span>`).join("")}</div>`}
        <p class="notas" style="margin-top:12px">Déficit total acumulado: <b>${f1(W.totales.deficitKg)} kg</b> y <b>${f0(W.totales.deficitCli)} clientes</b> en ${W.categoria === "TODAS" ? "activación general" : W.categoria}.</p>
      </div>`;

    return aviso +
      bloque("Déficit semanal en kilos", `Cuota mensual repartida en ${W.total} semanas según sus días hábiles (lunes a viernes sin feriados nacionales) · cada celda muestra el déficit acumulado y, debajo, kilos reales contra meta acumulada`, "kilosAcum", "metaKgAcum", "deficitKg", f1, W.totales.deficitKg) +
      bloque(`Déficit semanal en cobertura · ${W.categoria === "TODAS" ? "todas las categorías" : W.categoria}`, `Meta de clientes activados repartida en ${W.total} semanas según sus días hábiles, target ${W.target}% sobre la cartera asignada`, "clientesAcum", "metaCliAcum", "deficitCli", f0, W.totales.deficitCli);
  }

  /* meta de cada categoría repartida por semana (días hábiles), activados de la semana y resta,
     para el alcance elegido arriba (supervisor y vendedor) */
  function tablaMetaCategorias(){
    const cfg = leerCfg();
    VJ.setFeriados(cfg.feriados);
    const y = DS.anio, m = DS.mesNum, corte = VJ.corteDe(DS, cfg.corte);
    const sem = VJ.semanasDelMes(y, m), hab = VJ.diasHabiles(y, m) || 1;
    const off = sem.length && sem[0].lunes < 1 ? 0 : 1, lbl = i => "S" + (i + off);
    const supF = $("fSup") ? $("fSup").value : "TODOS", vendF = $("fVend").value;
    const vend = DS.vends.map((n, i) => ({ n, i, C: VJ.carteraDe(n) }))
      .filter(x => x.C && (!VJ.supSetDe(supF) || VJ.supSetDe(supF).has(x.C.sup)) && (vendF === "TODOS" || x.n === vendF));
    const ids = new Set(vend.map(x => x.i));
    const diaDe = DS.dias.map(f => parseInt(String(f).split("/")[0], 10));
    const primera = new Map();
    DS.r.forEach(x => {
      if ((x[8] || 0) !== VJ.TIPO_DOC.FACTURA || !(x[6] > 0) || !ids.has(x[2])) return;
      const d = diaDe[x[4]]; if (d > corte.d) return;
      const key = x[2] + "|" + x[0] + "|" + x[3];
      if (!primera.has(key) || d < primera.get(key)) primera.set(key, d);
    });
    const estado = s => s.hasta <= corte.d ? "cerrada" : (s.desde <= corte.d ? "curso" : "pend");
    const cats = Object.keys(VJ.TARGETS).filter(c => VJ.TARGETS[c] > 0).map(c => {
      const conf = VJ.CONFITES.indexOf(c) > -1, si = DS.subs.indexOf(c);
      const base = vend.reduce((s, x) => s + (conf ? x.C.conf : x.C.ab), 0);
      const meta = Math.round(base * VJ.TARGETS[c] / 100);
      const por = sem.map(() => 0);
      primera.forEach((d, key) => { if (+key.split("|")[2] === si) por[VJ.semanaDeDia(sem, y, m, d)]++; });
      const act = por.reduce((a, b) => a + b, 0);
      return { cat: c, base, meta, act, semanas: sem.map((s, i) => ({ meta: Math.round(meta * s.dias / hab * 10) / 10, real: por[i], estado: estado(s) })) };
    });
    const celda = s => {
      if (s.estado === "pend") return `<td class="sem fuera">${f1(s.meta)}<small>meta</small></td>`;
      const r = s.meta - s.real;
      return `<td class="sem"><span class="pill ${r > 0.05 ? "mal" : "ok"}">${r > 0.05 ? "resta " + f1(r) : (r < -0.05 ? "supera " + f1(-r) : "cumple")}</span>
        <small>${f0(s.real)} de ${f1(s.meta)}${s.estado === "curso" ? " · en curso" : ""}</small></td>`;
    };
    const alcance = vendF !== "TODOS" ? vendF : (supF !== "TODOS" ? (supF.indexOf("|") > -1 ? "equipos " + supF.split("|").join(", ") : "equipo " + supF) : "todos los asesores");
    return `<div class="tarjeta c12">
      <h3>Meta semanal por categoría · ${alcance}</h3>
      <p class="sub">La meta de cada categoría (maestro único × target Nestlé) se reparte entre las ${sem.length} semanas según sus días hábiles. Cada celda: <b>resta = meta − activados de la semana</b> y, debajo, activados contra meta. Corte ${String(corte.d).padStart(2, "0")}/${String(m).padStart(2, "0")}/${y}.</p>
      <div class="tw"><table>
        <thead><tr><th>Categoría</th><th>Meta mes</th>${sem.map((s, i) => `<th>${lbl(i)}<br><small style="font-weight:600">${s.desde}–${s.hasta} · ${s.dias} d</small></th>`).join("")}<th>Activados</th><th>Resta del mes</th></tr></thead>
        <tbody>${cats.map(c => `<tr><td><b>${c.cat}</b></td><td>${f0(c.meta)}</td>${c.semanas.map(celda).join("")}<td>${f0(c.act)}</td>
          <td><span class="pill ${c.meta - c.act > 0 ? "mal" : "ok"}">${c.meta - c.act > 0 ? f0(c.meta - c.act) : "cumple"}</span></td></tr>`).join("")}</tbody>
      </table></div>
      <p class="notas" style="margin-top:8px">Activados = clientes nuevos de la categoría en la semana (primera compra del mes en esa categoría con factura mayor a cero). Una semana en curso se compara con su meta completa.</p>
    </div>`;
  }

  function pintarSemanal(){ $("semanal").innerHTML = tablaSemanal() + tablaMetaCategorias(); }


  function pintar(){
    const cfg = leerCfg();
    const M = VJ.computeVend(DS, { categoria: $("fCat").value, vendedor: $("fVend").value, supervisor: $("fSup").value, corte: cfg.corte, maestro: MAE });
    const orden = $("fOrden").value;
    const sups = M.supervisores.slice().sort((a,b)=>
      orden === "faltan" ? b.faltan - a.faltan : orden === "cartera" ? b.cartera - a.cartera : (b.pct||0)-(a.pct||0));

    const mejor = M.supervisores[0];
    const peor = M.supervisores.slice().sort((a,b)=> b.faltan - a.faltan)[0];
    $("resumen").innerHTML = `
      <div class="tarjeta kpi c3"><p class="rot">${medida() === "inv" ? "Brecha pendiente del equipo" : medida() === "act" ? "Activación sobre la cartera" : "Cumplimiento del equipo comercial"}</p><p class="val">${fp(val(M.total))}</p>
        <div class="barrita"><span class="${sem(M.total.pct)}" style="width:${Math.min(100, val(M.total)||0)}%"></span></div>
        <p class="pie"><b>${f0(M.total.activados)}</b> activados de una meta de <b>${f0(M.total.meta)}</b> (${fp(M.total.pct)} de cumplimiento)<br>Cartera: ${f0(M.total.cartera)} clientes · activación ${fp(M.total.pctAct)}${M.total.sinCartera ? " · " + f0(M.total.sinCartera) + " fuera de cartera" : ""}</p></div>
      <div class="tarjeta kpi rojo c3"><p class="rot">Clientes por activar</p><p class="val">${f0(M.total.faltan)}</p>
        <p class="pie">Para la meta de ${M.categoria === "TODAS" ? "activación general" : M.categoria} · target <b>${M.target}%</b><br>Ritmo necesario: <b>${f1(M.total.porDia)}</b> activaciones por día hábil</p></div>
      <div class="tarjeta kpi verde c3"><p class="rot">Mejor supervisor</p><p class="val" style="font-size:1.15rem">${mejor ? mejor.supervisor : "—"}</p>
        <p class="pie">${mejor ? `<b>${fp(mejor.pct)}</b> de cumplimiento · ${f0(mejor.activados)} de ${f0(mejor.meta)}` : ""}</p></div>
      <div class="tarjeta kpi ambar c3"><p class="rot">Mayor brecha por cubrir</p><p class="val" style="font-size:1.15rem">${peor ? peor.supervisor : "—"}</p>
        <p class="pie">${peor ? `Faltan <b>${f0(peor.faltan)}</b> clientes · ${fp(peor.pct)} de cumplimiento` : ""}</p></div>`;

    $("alertas").innerHTML = alertas(M);
    $("categorias").innerHTML = tablaCat(M);
    $("equipos").innerHTML = sups.map(tarjetaSup).join("");
    $("tabla").innerHTML = tablaVend(M);
    pintarClientes();
    pintarRolling();
    pintarSemanal();
    $("subtit").textContent = `Período ${M.meta.desde} al ${M.meta.hasta} · ${M.supervisores.length} supervisores · ${M.vendedores.length} vendedores`;
    $("selloMes").textContent = "Performance " + M.meta.mes;
    $("selloAct").textContent = "Actualizado " + (DS.publicado || DS.generado || "—");
    $("pieArchivo").textContent = `Fuente: ${M.meta.archivo} · procesado el ${DS.generado}${DS.publicado ? " · publicado el " + DS.publicado : ""} · corte ${M.dias.corte} · página abierta el ${new Date().toLocaleString("es-VE")}`;
  }

  async function cargar(primera){
    VJ.setFeriados((VJ.leerLocal("vj_config") || {}).feriados);
    const r = await VJ.cargarDataset(DATASET_BASE);
    DS_TODO = r.ds;
    if (primera) {
      const est = leerEstado(), dias = DS_TODO.dias.map(diaN);
      RANGO.desde = est.desde || 1; RANGO.hasta = est.hasta || Math.max.apply(null, dias.length ? dias : [1]);
      if (!est.desde && !est.hasta) RANGO.hasta = 31;
    } else if (RANGO.completo) RANGO.hasta = 31;
    aplicarRango();
    setTimeout(() => document.dispatchEvent(new Event("vj:datos")), 0);
    $("estado").innerHTML = `Origen: <b>${r.origen}</b>${r.error && !/^repositorio/.test(r.origen) ? " · no se pudo leer dataset.json (" + r.error + ")" : ""}`;
    $("selloArchivo").textContent = VJ.sello(DS, r.origen);
    await cargarMaestro();
    if (MAE) VJ.carterasDesdeMaestro(MAE);          /* bases del tablero desde el maestro general */
    try {
      const ro = await VJ.traerJSON("activacion.json", 2);
      window.OFI_CARGADA = VJ.setOficial(ro.json && ro.json.filas ? ro.json : OFICIAL_BASE);
    } catch (e) { window.OFI_CARGADA = VJ.setOficial(OFICIAL_BASE); }
    aplicarRango();   /* actualiza la nota del rango ahora que la matriz oficial está cargada */

    if (primera) {
      const cats = Object.keys(VJ.TARGETS);
      $("fCat").innerHTML = `<option value="TODAS">Todas las categorías</option>` +
        cats.map(c => `<option value="${c}">${c} · target ${VJ.TARGETS[c]}%</option>`).join("");
      $("fCat").value = "CALDOS";
      const est = leerEstado();
      if (est.cat && $("fCat").querySelector(`option[value="${est.cat}"]`)) $("fCat").value = est.cat;
      if (est.medida) $("fMedida").value = est.medida;
      if (est.orden) $("fOrden").value = est.orden;
      if (est.vend) $("fVend").innerHTML = `<option>${est.vend}</option>`, $("fVend").value = est.vend;
      if (est.sup) $("fSup").value = est.sup;
    }
    listaSupervisores();
    listaVendedores();
    pintar();
    if (primera) { const est = leerEstado(); const b = est.vista && document.querySelector(`.pest[data-vista="${est.vista}"]`); if (b) b.click(); }
  }

  /* supervisores con equipo asignado y vendedores del supervisor elegido */
  const supDe = v => (VJ.CARTERAS[VJ.norm(v) === "DIRECTO" ? "DIRECTO OFICINA" : VJ.norm(v)] || {}).sup || null;
  /* coordinaciones: se pueden marcar varias a la vez; "TODOS" = todas */
  let SUPS_DISP = [];
  const supSel = () => { const v = $("fSup").value; return !v || v === "TODOS" ? [] : v.split("|"); };
  const corto = s => s.split(" ").map(w => w[0] + w.slice(1).toLowerCase()).join(" ");
  function etiquetaSup() {
    const s = supSel();
    $("bSup").textContent = !s.length ? "Todas las coordinaciones" : s.length === 1 ? corto(s[0]) : s.map(x => corto(x).split(" ")[0]).join(", ");
    $("bSup").title = !s.length ? "Todas las coordinaciones" : s.map(corto).join(", ");
  }
  function marcados() { return Array.from($("lSupM").querySelectorAll("input:checked")).map(i => i.value); }
  function fijarSup(lista, avisar) {
    const l = lista.filter(x => SUPS_DISP.indexOf(x) > -1);
    const nuevo = !l.length || l.length === SUPS_DISP.length ? "TODOS" : l.join("|");
    const cambio = nuevo !== $("fSup").value;
    $("fSup").value = nuevo; etiquetaSup();
    if (cambio && avisar !== false) $("fSup").dispatchEvent(new Event("change"));
  }
  function abrirSup(abrir) {
    $("pSup").hidden = !abrir; $("bSup").setAttribute("aria-expanded", abrir ? "true" : "false");
    if (!abrir && !marcados().length) { $("lSupM").querySelectorAll("input").forEach(i => i.checked = true); fijarSup(SUPS_DISP); }
  }
  function listaSupervisores(){
    const orden = ["SARA VELASQUEZ", "RORAIMA SALAZAR", "DANNY LA CRUZ", "RICARDO TEIXEIRA", "DIRECTO OFICINA"];
    const sups = Array.from(new Set(DS.vends.map(supDe).filter(Boolean)))
      .sort((a, b) => ((orden.indexOf(a) + 1 || 99) - (orden.indexOf(b) + 1 || 99)) || a.localeCompare(b));
    SUPS_DISP = sups;
    const sel = supSel().filter(s => sups.indexOf(s) > -1);
    $("fSup").value = !sel.length || sel.length === sups.length ? "TODOS" : sel.join("|");
    $("lSupM").innerHTML = sups.map(s => `<label class="multi-op"><input type="checkbox" value="${s}" ${!sel.length || sel.indexOf(s) > -1 ? "checked" : ""}>${corto(s)}</label>`).join("");
    etiquetaSup();
  }
  $("bSup").addEventListener("click", e => { e.stopPropagation(); abrirSup($("pSup").hidden); });
  $("pSup").addEventListener("click", e => e.stopPropagation());
  $("lSupM").addEventListener("change", () => { if (marcados().length) fijarSup(marcados()); });
  $("bSupTodas").addEventListener("click", () => { $("lSupM").querySelectorAll("input").forEach(i => i.checked = true); fijarSup(SUPS_DISP); });
  $("bSupNinguna").addEventListener("click", () => { $("lSupM").querySelectorAll("input").forEach(i => i.checked = false); });
  $("bSupListo").addEventListener("click", () => abrirSup(false));
  document.addEventListener("click", () => { if (!$("pSup").hidden) abrirSup(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("pSup").hidden) abrirSup(false); });

  function listaVendedores(){
    const supS = supSel();
    const conCartera = DS.vends.filter(v => supDe(v) && (!supS.length || supS.indexOf(supDe(v)) > -1)).sort();
    const sel = $("fVend").value;
    $("fVend").innerHTML = '<option>TODOS</option>' + conCartera.map(v=>`<option>${v}</option>`).join("");
    $("fVend").value = sel && conCartera.indexOf(sel) > -1 ? sel : "TODOS";
  }

  /* estado de la vista en la pestaña del navegador: al volver del resumen se retoma igual */
  function leerEstado(){ try { return JSON.parse(sessionStorage.getItem("vj_perf_estado") || "{}"); } catch(e){ return {}; } }
  function guardarEstado(){
    const act = document.querySelector(".pest.activa");
    try { sessionStorage.setItem("vj_perf_estado", JSON.stringify({ cat: $("fCat").value, vend: $("fVend").value, sup: $("fSup").value,
      medida: $("fMedida").value, orden: $("fOrden").value, vista: act ? act.dataset.vista : "equipos",
      desde: RANGO.completo ? null : RANGO.desde, hasta: RANGO.completo ? null : RANGO.hasta })); } catch(e){}
  }
  $("bIrReporte").addEventListener("click", () => { guardarEstado(); window.location.href = "reporte.html"; });
  ["fDesde", "fHasta"].forEach(id => $(id).addEventListener("change", () => { rangoDesdeInputs(); aplicarRango(); guardarEstado(); listaVendedores(); pintar(); }));
  $("bMesCompleto").addEventListener("click", () => { RANGO.desde = 1; RANGO.hasta = 31; aplicarRango(); guardarEstado(); listaVendedores(); pintar(); });

  $("fCat").addEventListener("change", pintar);
  $("fOrden").addEventListener("change", pintar);
  $("fVend").addEventListener("change", pintar);
  $("fSup").addEventListener("change", () => { listaVendedores(); pintar(); });
  $("fMedida").addEventListener("change", pintar);
  $("bPrint").addEventListener("click", ()=> window.print());
  document.querySelectorAll(".pest").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".pest").forEach(x => x.classList.remove("activa"));
    b.classList.add("activa");
    const v = b.dataset.vista;
    ["alertas","categorias","equipos","tabla"].forEach(id => $(id).style.display = v === "equipos" ? "grid" : "none");
    $("clientes").style.display = v === "clientes" ? "grid" : "none";
    $("rolling").style.display = v === "rolling" ? "grid" : "none";
    $("semanal").style.display = v === "semanal" ? "grid" : "none";
  }));
  $("bRecargar").addEventListener("click", async () => {
    $("bRecargar").disabled = true;
    $("bRecargar").textContent = "Recargando…";
    await cargar(false);
    $("bRecargar").textContent = "Recargar datos";
    $("bRecargar").disabled = false;
  });
  cargar(true);
})();
