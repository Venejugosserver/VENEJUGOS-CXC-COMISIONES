<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venejugos · Performance vendedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0B2A8A;        /* azul Venejugos profundo */
  --azul-med:#1740C4;
  --azul-claro:#E8EDFB;
  --rojo:#E5142B;
  --rojo-oscuro:#B00C1F;
  --blanco:#FFFFFF;
  --papel:#F4F6FC;
  --tinta:#10193A;
  --gris:#66708F;
  --linea:#D8DFF2;
  --verde:#128C5A;
  --ambar:#E08A00;
  --sombra:0 1px 2px rgba(11,42,138,.10), 0 8px 24px rgba(11,42,138,.07);
  --radio:14px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--papel); color:var(--tinta);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- Encabezado ---------- */
.barra{
  background:linear-gradient(105deg,var(--azul) 0%,var(--azul-med) 58%,#2C56E0 100%);
  color:#fff; position:relative; overflow:hidden;
}
.barra::after{
  content:""; position:absolute; right:-70px; top:-60px; width:260px; height:260px;
  background:var(--rojo); border-radius:50%; opacity:.9;
  clip-path:polygon(0 40%,100% 0,100% 100%,0 100%);
}
.barra-in{display:flex; gap:18px; align-items:center; padding:18px 26px; position:relative; z-index:2; flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;padding:5px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tit h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tit p{margin:3px 0 0;font-size:.82rem;color:#C9D6FF;font-weight:500}
.sello{
  margin-left:auto;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 15px;font-size:.76rem;font-weight:700
}
.sello b{color:#fff}

/* ---------- Cinta de filtros ---------- */
.filtros{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--linea);padding:12px 26px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20
}
.campo{display:flex;flex-direction:column;gap:4px;min-width:150px}
.campo label{font-size:.68rem;font-weight:700;color:var(--gris);letter-spacing:.03em}
select,input[type=number],input[type=text],input[type=password],input[type=file]{
  font-family:inherit;font-size:.86rem;padding:8px 10px;border:1.5px solid var(--linea);
  border-radius:9px;background:#fff;color:var(--tinta);min-width:140px
}
select:focus,input:focus{outline:2px solid var(--azul-med);outline-offset:1px;border-color:var(--azul-med)}
.btn{
  font-family:inherit;font-size:.84rem;font-weight:700;padding:9px 18px;border-radius:9px;border:0;
  background:var(--rojo);color:#fff;cursor:pointer;transition:background .15s
}
.btn:hover{background:var(--rojo-oscuro)}
.btn.azul{background:var(--azul)} .btn.azul:hover{background:var(--azul-med)}
.btn.linea{background:#fff;color:var(--azul);border:1.5px solid var(--linea)}
.btn.linea:hover{background:var(--azul-claro)}
.btn:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

/* ---------- Rejilla ---------- */
main{padding:20px 26px 48px;max-width:1500px;margin:0 auto}
.rej{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1080px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media(max-width:620px){.c3{grid-column:span 12}}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px}
.tarjeta h3{margin:0 0 2px;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.tarjeta .sub{margin:0 0 12px;font-size:.74rem;color:var(--gris)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--azul)}
.kpi.rojo::before{background:var(--rojo)}
.kpi.verde::before{background:var(--verde)}
.kpi.ambar::before{background:var(--ambar)}
.kpi .rot{font-size:.72rem;font-weight:700;color:var(--gris);margin:0 0 6px}
.kpi .val{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.kpi .val small{font-size:.9rem;font-weight:700;color:var(--gris);margin-left:4px}
.kpi .pie{margin:8px 0 0;font-size:.74rem;color:var(--gris);line-height:1.45}
.kpi .pie b{color:var(--tinta)}

.barrita{height:7px;background:var(--azul-claro);border-radius:99px;overflow:hidden;margin-top:10px}
.barrita span{display:block;height:100%;border-radius:99px;background:var(--azul-med)}
.barrita span.ok{background:var(--verde)} .barrita span.mal{background:var(--rojo)} .barrita span.med{background:var(--ambar)}

/* Tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{
  text-align:right;font-weight:700;color:#fff;background:var(--azul);
  padding:9px 10px;white-space:nowrap;position:sticky;top:0
}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFBFF}
tbody tr:hover{background:var(--azul-claro)}
tfoot td{font-weight:800;background:var(--azul-claro);border-top:2px solid var(--azul)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:800}
.pill.ok{background:#DCF3E9;color:var(--verde)}
.pill.med{background:#FDF0D8;color:var(--ambar)}
.pill.mal{background:#FBE0E3;color:var(--rojo-oscuro)}

.grafico{position:relative;height:300px}
.grafico.alto{height:380px}
.grafico.bajo{height:210px}

/* Resumen */
.resumen{background:linear-gradient(160deg,#fff 0%,#F7F9FF 100%);border-left:5px solid var(--rojo)}
.resumen p{font-size:.88rem;line-height:1.62;margin:0 0 12px;max-width:78ch;color:#1D2748}
.resumen p:last-child{margin-bottom:0}
.notas{font-size:.72rem;color:var(--gris);line-height:1.55}

dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:92%;box-shadow:0 30px 80px rgba(11,42,138,.35)}
dialog::backdrop{background:rgba(11,25,58,.55)}
dialog .cab{background:var(--azul);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
dialog .cab h3{margin:0;font-size:1rem}
dialog .cue{padding:20px 22px;max-height:65vh;overflow:auto}

.pie-doc{margin-top:26px;padding-top:14px;border-top:2px solid var(--linea);font-size:.72rem;color:var(--gris);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Impresión */
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff}
  .filtros,.no-print{display:none!important}
  .barra{position:static}
  main{padding:0;max-width:none}
  .tarjeta{box-shadow:none;border:1px solid #C8D2EC;break-inside:avoid;page-break-inside:avoid}
  .rej{gap:9px}
  .grafico{height:230px}
  .salto{break-before:page;page-break-before:always}
}

.sup-cab{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.dona{flex:0 0 auto}
.dona text{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.sup-cab .nom{font-size:1.02rem;font-weight:800;margin:0;line-height:1.2}
.sup-cab .cifra{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.sup-cab .cifra small{font-size:.72rem;font-weight:700;color:var(--gris);display:block;letter-spacing:0}
.equipo{list-style:none;margin:0;padding:0}
.equipo li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:.84rem}
.equipo li+li{margin-top:4px}
.equipo li.bajo{background:#FDF1F3;border:1px solid #F6C9D0}
.equipo .punto{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.equipo .quien{flex:1;font-weight:700}
.equipo .par{font-family:Arial,Helvetica,sans-serif;color:var(--gris);white-space:nowrap}
.equipo .par b{color:var(--tinta)}
.equipo .tanto{font-weight:800;min-width:52px;text-align:right}
.t-ok{color:var(--verde)} .t-med{color:var(--ambar)} .t-mal{color:var(--rojo)}
.cintas{display:flex;height:9px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--azul-claro)}
.cintas span{display:block}
.aviso{border-left:5px solid var(--rojo);background:linear-gradient(160deg,#FFF5F6 0%,#fff 70%)}
.aviso h3{color:var(--rojo-oscuro)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:800;margin:3px 4px 0 0}
.chip.mal{background:#FBE0E3;color:var(--rojo-oscuro)}
.chip.med{background:#FDF0D8;color:var(--ambar)}
td.sem{min-width:84px}
td.sem small{display:block;font-size:.68rem;color:var(--gris);font-weight:600}
td.fuera{color:var(--gris)}
.pestanas{display:flex;gap:8px;border-bottom:2px solid var(--linea);padding-bottom:0}
.pest{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;border:0;background:transparent;color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.pest:hover{color:var(--azul)}
.pest.activa{color:var(--azul);border-bottom-color:var(--rojo)}
.buscador{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.buscador input{min-width:260px}
tr.grupo td{background:var(--azul-claro);font-weight:800;border-top:2px solid var(--azul)}
tr.granTotal td{background:var(--azul);color:#fff;font-weight:800}
tr.granTotal .pill{background:rgba(255,255,255,.18);color:#fff}


.armador{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px}
@media(max-width:1100px){.armador{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.armador{grid-template-columns:1fr}}
.caja{border:1.5px solid var(--linea);border-radius:10px;max-height:170px;overflow:auto;padding:6px 8px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:.84rem;font-weight:600;cursor:pointer;border-radius:6px}
.chk:hover{background:var(--azul-claro)}
.chk input{accent-color:var(--rojo);width:16px;height:16px;flex:0 0 auto}
.chk small{color:var(--gris);font-weight:500;font-size:.72rem;white-space:nowrap}
.atajos{margin:6px 0 0;font-size:.76rem}
.atajos a{color:var(--azul-med);font-weight:700;cursor:pointer;margin-right:12px}
.atajos a:hover{text-decoration:underline}
.vacio{font-size:.8rem;color:var(--gris);margin:6px}
.parametros{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media(max-width:1100px){.parametros{grid-template-columns:repeat(2,1fr)}}
.parametros .campo{min-width:0}
.parametros select,.parametros input{width:100%}
.pest-link{font-family:inherit;font-size:.86rem;font-weight:700;padding:10px 20px;color:var(--rojo);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px;margin-left:auto}
.pest-link:hover{color:var(--rojo-oscuro);border-bottom-color:var(--rojo)}
.logo-nestle{width:auto;max-width:120px;object-fit:contain;padding:0;margin-left:-6px;background:#0F5FA8;border-radius:12px}
/* ---- reporte adaptable ---- */
.rotb{font-size:.7rem;font-weight:800;color:var(--gris);letter-spacing:.04em;margin:12px 0 6px;text-transform:uppercase}
.botonera{display:flex;flex-wrap:wrap;gap:8px}
.rb{font-family:inherit;font-size:.82rem;font-weight:700;padding:8px 14px;border-radius:99px;border:1.5px solid var(--linea);background:#fff;color:var(--azul);cursor:pointer}
.rb:hover{background:var(--azul-claro)}
.rb.on{background:var(--azul);border-color:var(--azul);color:#fff}
.documento{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:34px 40px;max-width:980px;margin:0 auto;width:100%}
.documento table tr{break-inside:avoid}
@page reporte{size:A4 portrait;margin:14mm}
@media print{
  body.imp-reporte header, body.imp-reporte .filtros, body.imp-reporte #resumen, body.imp-reporte .pestanas,
  body.imp-reporte main > .rej:not(#reporte), body.imp-reporte .pie-doc, body.imp-reporte #reporte > .tarjeta{display:none!important}
  body.imp-reporte #reporte{display:block!important;margin:0!important}
  body.imp-reporte .documento{page:reporte;box-shadow:none;border:0;padding:0;max-width:none;border-radius:0}
}

/* ---- vista adaptable a teléfonos (5" a 6,7") ---- */
.pestanas{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pest,.pest-link{white-space:nowrap;flex:0 0 auto}
@media(max-width:600px){
  .barra-in{padding:12px 14px!important;gap:10px!important}
  .logo{width:42px!important;height:42px!important;border-radius:10px!important}
  .tit h1{font-size:1.05rem!important;line-height:1.2}
  .tit p{font-size:.7rem!important;line-height:1.35}
  .sello{font-size:.66rem!important;padding:5px 10px!important;max-width:100%!important;margin-left:0!important}
  .filtros{position:static!important;padding:10px 12px!important;gap:8px!important}
  .filtros .campo{min-width:0!important;flex:1 1 100%}
  .filtros select,.filtros input{width:100%!important;min-width:0!important;font-size:16px}
  .filtros .btn{flex:1 1 calc(50% - 8px);padding:11px 8px;font-size:.8rem}
  #estado{margin-left:0!important;width:100%;font-size:.7rem!important}
  main{padding:12px 10px 28px!important}
  .rej{gap:10px!important}
  .tarjeta{padding:14px!important;border-radius:12px}
  .kpi .val{font-size:1.6rem!important}
  .pest{padding:10px 12px!important;font-size:.8rem!important}
  .tw{max-width:100%}
  table{font-size:.76rem}
  th,td{padding:7px 8px!important}
  .equipo li{flex-wrap:wrap}
  .equipo .quien{flex:1 1 60%}
  .buscador input{min-width:0!important;width:100%}
  .pie-doc{flex-direction:column;gap:4px;font-size:.66rem}
}
@media(max-width:380px){ .tit p{display:none} .filtros .btn{font-size:.74rem;padding:10px 6px} }

/* ---- teléfonos en horizontal y pantallas con muesca (1792x828, 2280x1080, 2436x1125, 2520x1080, 3040x1440) ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media(max-width:1180px){
  .hoja table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .hoja{max-width:100%}
}
@media(max-height:520px){
  .filtros{position:static!important}
  .barra-in{padding-top:10px!important;padding-bottom:10px!important}
  .acceso{min-height:auto!important;padding:16px!important}
}
@media(max-height:520px) and (min-width:600px){
  .tit p{display:none}
  .logo{width:44px!important;height:44px!important}
}

/* ---- matriz de activación (igual a la hoja de la coordinación) ---- */
.mx-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:78vh;border:1px solid var(--linea);border-radius:12px;background:#fff}
.mx{border-collapse:separate;border-spacing:0;font-size:.74rem;min-width:1500px;width:100%}
.mx th,.mx td{padding:5px 7px;border-right:1px solid #E3E8F4;border-bottom:1px solid #E3E8F4;text-align:center;white-space:nowrap}
.mx thead th{background:#1F5FBF;color:#fff;font-weight:800;position:sticky;z-index:2}
.mx thead tr:nth-child(1) th{top:0;background:#1F5FBF}
.mx thead tr:nth-child(2) th{top:26px;background:#2F6FD0}
.mx thead tr:nth-child(3) th{top:52px;background:#F8C9A8;color:#0E1A38}
.mx thead tr:nth-child(4) th{top:78px;background:#0B4FB3}
.mx tbody td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:#fff;min-width:150px}
.mx thead tr:first-child th:first-child{position:sticky;left:0;z-index:3;background:#0B4FB3;text-align:left;min-width:150px}
.mx tr.sup td{background:#D9DDE6;font-weight:800}
.mx tr.sup td:first-child{background:#D9DDE6}
.mx tr.tot td{background:#0B2A6E;color:#fff;font-weight:800}
.mx tr.tot td:first-child{background:#0B2A6E}
.mx .ok{color:#1A73E8;font-weight:700}
.mx .bajo{color:#E5142B;font-weight:700}
.mx .ic-ok{color:#128C5A;font-weight:900}
.mx .ic-al{color:#E0A100;font-weight:900}
.mx td.bk{border-left:2px solid #9BB4E6}
.mx-cab{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.mx-cab .chip{background:#FCE3D3;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.78rem}
@media(max-width:600px){ .mx{font-size:.68rem} .mx th,.mx td{padding:4px 5px} .mx tbody td:first-child,.mx thead tr:first-child th:first-child{min-width:118px} }
@media print{ .mx-wrap{max-height:none;overflow:visible} .mx{min-width:0;font-size:6.5pt} }

/* ---- filtro por fechas ---- */
.campo-fecha input[type=date]{font-family:inherit;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta);min-width:150px}
.nota-rango{flex:1 1 100%;margin:2px 0 0;font-size:.76rem;color:var(--gris)}
.nota-rango b{color:var(--azul)}
@media(max-width:600px){ .campo-fecha{flex:1 1 calc(50% - 8px)!important} .campo-fecha input[type=date]{width:100%;min-width:0;font-size:16px} }

/* ---- coordinaciones: lista desplegable con selección múltiple ---- */
.multi{position:relative}
.multi-btn{width:100%;min-width:210px;text-align:left;font-family:inherit;font-size:.9rem;padding:9px 34px 9px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gris) 50%),linear-gradient(135deg,var(--gris) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi-panel{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:100%;background:#fff;border:1.5px solid var(--linea);border-radius:12px;box-shadow:0 12px 30px rgba(11,25,58,.18);padding:8px}
.multi-acc{display:flex;gap:6px;margin-bottom:6px}
.multi-acc button{flex:1;font-family:inherit;font-size:.74rem;font-weight:800;border:1.5px solid var(--linea);background:#F4F6FC;color:var(--azul);border-radius:8px;padding:6px 8px;cursor:pointer}
.multi-acc #bSupListo{background:var(--azul);color:#fff;border-color:var(--azul)}
.multi-op{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap}
.multi-op:hover{background:#F4F6FC}
.multi-op input,.filtros .multi-op input,.armar .multi-op input{width:18px!important;min-width:18px!important;height:18px;flex:0 0 18px;padding:0!important;margin:0;accent-color:var(--azul)}
.campo .multi-op,.armar .multi-op{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:10px;font-size:.86rem!important;font-weight:700!important;color:var(--tinta)!important;letter-spacing:0!important;text-transform:none}
@media(max-width:600px){ .multi-btn{min-width:0;font-size:16px} .multi-panel{position:absolute;left:0;right:0;width:auto;padding:10px;max-height:60vh;overflow:auto} .campo .multi-op,.armar .multi-op{padding:12px 8px;font-size:1rem!important} }
@media print{ .multi-panel{display:none!important} }

/* ---- rótulos Meta / Activados / Falta sobre los números ---- */
.cifra.et2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.cifra .et-n{display:inline-flex;flex-direction:column;line-height:1.05}
.cifra .et-n i,.equipo .col i,.eq-cab span{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.cifra .et-n i{margin-bottom:3px}
.cifra .et-sep{font-size:1.2rem;color:var(--gris);padding-bottom:2px}
.cifra.et2 small{flex:1 1 100%}
.eq-cab,.equipo.cols li{display:grid;grid-template-columns:12px minmax(0,1fr) 58px 72px 52px 66px;align-items:center;gap:8px}
.eq-cab{padding:6px 10px 2px;border-bottom:1px solid var(--linea);margin-bottom:2px}
.eq-cab span{text-align:right}.eq-cab span:nth-child(2){text-align:left}
.equipo.cols .col{text-align:right;font-family:Arial,Helvetica,sans-serif;font-weight:800;color:var(--tinta)}
.equipo.cols .col.f{color:var(--gris);font-weight:700}
.equipo.cols .tanto{min-width:0}
@media(max-width:600px){ .eq-cab,.equipo.cols li{grid-template-columns:10px minmax(0,1fr) 44px 58px 40px 56px;gap:5px;font-size:.78rem} .eq-cab span{font-size:.56rem} }

/* =====================================================================
   ACABADO PROFESIONAL (capa visual; no cambia estructura ni cálculos)
   ===================================================================== */
:root{
  --azul:#0A2A7A; --azul-med:#1B47C9; --azul-claro:#EEF2FC; --papel:#F3F5FA; --tinta:#0F1B3D; --gris:#5F6B8A; --linea:#E1E6F2;
  --verde:#0F8A5F; --ambar:#C97A00; --rojo:#D7192E;
  --sombra:0 1px 2px rgba(15,27,61,.06), 0 6px 18px rgba(15,27,61,.06); --radio:14px;
}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:-.005em}
/* encabezado: limpio, con acento rojo de marca */
.barra{background:linear-gradient(120deg,#08205F 0%,#0D2F8C 55%,#1743BD 100%)}
.barra::after{right:-120px;top:auto;bottom:-170px;width:420px;height:300px;opacity:.95;border-radius:0;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%);background:linear-gradient(135deg,#E5142B,#B30F22)}
.barra::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#E5142B 0,#E5142B 30%,transparent 30%);z-index:3}
.barra-in{padding:16px 28px 18px}
.logo{border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.tit h1{font-size:1.28rem;letter-spacing:-.025em}
.tit p{color:#B9C8F2;font-size:.8rem}
.sello{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);font-weight:700;font-size:.72rem;padding:6px 13px;backdrop-filter:blur(4px)}
/* barra de filtros como panel ordenado */
.filtros{background:#fff;border-bottom:1px solid var(--linea);box-shadow:0 2px 10px rgba(15,27,61,.05);padding:14px 28px 12px;gap:12px 14px}
.campo label{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
select,input[type=number],input[type=text],input[type=date],.multi-btn{height:40px;border:1px solid #D5DCEC!important;border-radius:10px!important;background-color:#FBFCFF;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover,.multi-btn:hover{border-color:#B9C4E2!important}
select:focus,input:focus,.multi-btn:focus{outline:none;border-color:var(--azul-med)!important;box-shadow:0 0 0 3px rgba(27,71,201,.15)}
.btn{height:40px;border-radius:10px;font-weight:800;letter-spacing:.01em;box-shadow:0 1px 2px rgba(15,27,61,.12)}
.btn.linea{box-shadow:none;border:1px solid #D5DCEC}
.nota-rango{background:#F5F7FD;border:1px solid var(--linea);border-radius:10px;padding:8px 12px;color:var(--gris)}
.nota-rango a{color:var(--azul-med);font-weight:800}
#estado{font-size:.72rem}
main{padding:22px 28px 52px}
/* tarjetas */
.tarjeta{border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 20px}
.tarjeta h3{font-size:.98rem;font-weight:800;letter-spacing:-.015em;color:var(--tinta)}
.tarjeta .sub{font-size:.74rem;color:var(--gris);line-height:1.5}
/* indicadores: acento superior en lugar de franja lateral */
.kpi::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
.kpi .rot{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#7A86A6}
.kpi .val{font-size:2rem;letter-spacing:-.035em;margin-top:2px}
.kpi .pie{font-size:.74rem;color:var(--gris);line-height:1.5}
.barrita{height:6px;border-radius:99px;background:#EDF0F8}
/* pestañas tipo control segmentado */
.pestanas{border-bottom:0;background:#E9EDF7;border-radius:12px;padding:4px;display:inline-flex;gap:4px;max-width:100%}
.pest{border:0!important;border-radius:9px;padding:9px 18px;margin:0!important;color:#4E5A7A;font-weight:800;font-size:.84rem}
.pest:hover{color:var(--azul)}
.pest.activa{background:#fff;color:var(--azul);box-shadow:0 1px 3px rgba(15,27,61,.14)}
/* tablas */
table{font-size:.82rem}
thead th{background:#0E2A78;color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;position:sticky;top:0;z-index:1}
thead th:first-child{border-top-left-radius:10px} thead th:last-child{border-top-right-radius:10px}
tbody td{padding:9px 12px;border-bottom:1px solid #EEF1F8}
tbody tr:nth-child(even){background:#FAFBFE}
tbody tr:hover{background:#EEF3FF}
tfoot td{background:#EEF2FC;border-top:2px solid #0E2A78}
.pill{padding:3px 10px;font-size:.7rem;letter-spacing:.01em}
.tw{border-radius:10px}
/* listas de alerta y equipos: filas limpias con indicador lateral */
.equipo li{border-radius:10px;transition:background .12s}
.equipo li:hover{background:#F5F7FD}
.equipo li.bajo{background:#FFF6F7;border:1px solid #F8D7DC;box-shadow:inset 3px 0 0 var(--rojo)}
.cintas{height:7px}
.sup-cab .nom{letter-spacing:-.01em}
.notas{color:#6B7695}
.pie-doc{border-top:1px solid var(--linea);color:#7A86A6}
@media(max-width:600px){
  .barra-in{padding:12px 14px 14px!important}
  .pestanas{display:flex;border-radius:10px}
  .pest{padding:9px 12px!important}
  .kpi .val{font-size:1.6rem}
  thead th{padding:8px 8px}
  tbody td{padding:8px 8px}
}
@media(max-width:600px){.barra::after{width:200px;height:220px;right:-90px;bottom:-150px;opacity:.9}}
@media print{
  .barra::before,.barra::after{display:none}
  .pestanas{background:none}
  thead th{position:static}
}
</style>
</head>

  const MAESTROS = { general: 1026, confites: 1274, nestle: 1562 };   /* A&B, Confites (chocolates y galletas) y base total del maestro */   /* UN SOLO maestro de clientes para todas las categorías */
  /* Cartera por vendedor = clientes que tiene en el maestro único (sin RECUPERACION).
     ab, conf y tot son el mismo número: no hay dos maestros. */
  const CARTERAS = {
    "SUGEI VEGA":          { ab: 95, conf: 82, tot: 125, sup: "SARA VELASQUEZ" },
    "MANUEL MONTILLA":     { ab: 67, conf: 104, tot: 134, sup: "SARA VELASQUEZ" },
    "JEFFERSON PRIETO":    { ab: 83, conf: 95, tot: 108, sup: "SARA VELASQUEZ" },
    "RICARDO GONZALEZ":    { ab: 74, conf: 78, tot: 89, sup: "SARA VELASQUEZ" },
    "BETZI SANCHEZ":       { ab: 77, conf: 81, tot: 100, sup: "RORAIMA SALAZAR" },
    "MAYLIN GUTIERREZ":    { ab: 72, conf: 68, tot: 96, sup: "RORAIMA SALAZAR" },
    "ENLLYS NAVARRO":      { ab: 23, conf: 54, tot: 60, sup: "RORAIMA SALAZAR" },
    "JEINNY NIETO":        { ab: 61, conf: 93, tot: 111, sup: "RORAIMA SALAZAR" },
    "DEYBER ALCANTARA":    { ab: 80, conf: 82, tot: 103, sup: "DANNY LA CRUZ" },
    "LUIS FRIAS":          { ab: 91, conf: 99, tot: 117, sup: "DANNY LA CRUZ" },
    "ZULEXIS MENDOZA":     { ab: 81, conf: 106, tot: 125, sup: "DANNY LA CRUZ" },
    "ALEXANDER BORGES":    { ab: 52, conf: 93, tot: 103, sup: "DANNY LA CRUZ" },
    "LISBETH FERRER":      { ab: 19, conf: 46, tot: 51, sup: "RICARDO TEIXEIRA" },
    "MARY SUAREZ":         { ab: 10, conf: 40, tot: 46, sup: "RICARDO TEIXEIRA" },
    "YEISON UMBRIA":       { ab: 53, conf: 49, tot: 55, sup: "DIRECTO OFICINA" },
    "KEIBER BETANCOURT":   { ab: 65, conf: 66, tot: 94, sup: "DIRECTO OFICINA" },
    "FRANCHESKA SANCHEZ":  { ab: 15, conf: 29, tot: 32, sup: "DIRECTO OFICINA" },
    "DIRECTO OFICINA":     { ab: 8, conf: 9, tot: 13, sup: "DIRECTO OFICINA" },
    "VENEJUGOS EMPLEADOS": { ab: 0, conf: 0, tot: 0, sup: "DIRECTO OFICINA" }
  };
  const ALIAS_VEND = {};   /* como la hoja oficial: las ventas del vendedor DIRECTO no se suman a Directo Oficina */
  /* Cuota de kilos del mes por vendedor (rolling Nestlé) */
  const CUOTAS_VEND_KG = {
    "SUGEI VEGA": 1354, "MANUEL MONTILLA": 562, "JEFFERSON PRIETO": 973, "RICARDO GONZALEZ": 481,
    "BETZI SANCHEZ": 783, "MAYLIN GUTIERREZ": 854, "ENLLYS NAVARRO": 190, "JEINNY NIETO": 472,
    "DEYBER ALCANTARA": 677, "LUIS FRIAS": 502, "ZULEXIS MENDOZA": 494, "ALEXANDER BORGES": 841,
    "LISBETH FERRER": 664, "MARY SUAREZ": 321,
    "YEISON UMBRIA": 3218, "KEIBER BETANCOURT": 2537, "FRANCHESKA SANCHEZ": 77,
    "DIRECTO OFICINA": 0, "VENEJUGOS EMPLEADOS": 0
  };
  const carteraDe = nombre => CARTERAS[ALIAS_VEND[norm(nombre)] || norm(nombre)] || null;

  /* Cuota de kilos del mes por categoría (editable desde el panel administrativo) */
  const CUOTAS_KG = {
    "CALDOS": 3706, "CHOCOLATES": 3812, "CERELAC": 1311,
    "LA CAMPESINA": 789, "LECHE CONDENSADA": 350
  };

  /* Tipo de documento:
     0 = factura activa
     1 = nota de crédito de tesorería o administrativa (NCTESO): se excluye del cálculo
     2 = nota de crédito ligada a una factura de origen: netea monto y kilos,
         pero nunca desactiva la categoría */
  const TIPO_DOC = { FACTURA: 0, NC_TESORERIA: 1, NC_LIGADA: 2 };
  const NC_ADMIN = /^(NCTESO|NCADM|NCTES|NCA)/;
  function tipoDocumento(doc, origen) {
    const d = String(doc == null ? "" : doc).toUpperCase().trim();
    if (!/^N[CD]/.test(d)) return TIPO_DOC.FACTURA;
    if (NC_ADMIN.test(d)) return TIPO_DOC.NC_TESORERIA;
    return String(origen || "").trim() ? TIPO_DOC.NC_LIGADA : TIPO_DOC.NC_TESORERIA;
  }

  /* Solo se procesa la data de Nestlé: si la fila identifica proveedor, categoría o
     tipo de inventario y ninguno menciona Nestlé, la línea se descarta. */
  function esNestle(cat, tipoInv, prov) {
    const campos = [cat, tipoInv, prov].map(v => String(v == null ? "" : v).toUpperCase());
    if (campos.every(v => !v.trim())) return true;
    return campos.some(v => v.indexOf("NESTL") > -1);
  }

  /* RIF o cédula normalizado para cruzar el maestro con las ventas */
  const rifN = s => (s => {
    /* RIF canónico: sin guiones ni espacios; las sucursales llevan "/n" (n = 2, 3…) y "-1" o "/1" es la principal.
       Un "-n" final solo es sucursal si el RIF ya está completo (10 caracteres); si no, es el dígito
       verificador escrito con guion (J-40794045-7). */
    const t = String(s == null ? "" : s).toUpperCase().trim();
    let m = /^(.*?)\s*\/\s*(\d{1,3})$/.exec(t);
    if (m) { const b = m[1].replace(/[^A-Z0-9]/g, ""), n = parseInt(m[2], 10); return n > 1 ? b + "/" + n : b; }
    m = /^(.*?)\s*-\s*(\d{1,3})$/.exec(t);
    if (m) { const b = m[1].replace(/[^A-Z0-9]/g, ""); if (b.length >= 10) { const n = parseInt(m[2], 10); return n > 1 ? b + "/" + n : b; } }
    return t.replace(/[^A-Z0-9]/g, "");
  })(s);

  /* RIF del maestro -> asesor del maestro (sin RECUPERACION). null si no hay maestro. */
  function mapaMaestro(arr) {
    if (!Array.isArray(arr) || !arr.length) return null;
    const m = new Map();
    arr.forEach(c => { const k = rifN(c.rif), v = ALIAS_VEND[norm(c.vend)] || norm(c.vend); if (k && v !== "RECUPERACION" && !m.has(k)) m.set(k, v); });
    return m.size ? m : null;
  }

  function norm(s) {
    return String(s == null ? "" : s)
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toUpperCase().trim().replace(/\s+/g, " ");
  }

  function num(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return isFinite(v) ? v : 0;
    let s = String(v).trim().replace(/\s|\u00A0/g, "");
    const coma = s.lastIndexOf(","), punto = s.lastIndexOf(".");
    if (coma > -1 && punto > -1) {
      s = coma > punto ? s.replace(/\./g, "").replace(",", ".")   // 1.234,56
                       : s.replace(/,/g, "");                      // 1,234.56
    } else if (coma > -1) {
      s = (s.length - coma - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* fecha "dd/mm/aaaa" -> {y,m,d,key} ; también acepta Date */
  function parseFecha(v) {
    if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
    const s = String(v).trim().split(" ")[0];
    let p = s.split(/[\/\-]/).map(Number);
    if (p.length < 3 || p.some(isNaN)) return null;
    if (p[0] > 31) return { y: p[0], m: p[1], d: p[2] };      // aaaa-mm-dd
    return { y: p[2], m: p[1], d: p[0] };                      // dd/mm/aaaa
  }
  const pad = n => String(n).padStart(2, "0");

  /* Feriados del mes (dd/mm/aaaa) cargados en el panel administrativo:
     un feriado de lunes a viernes deja de contar como día hábil. */
  let FERIADOS = new Set();
  function setFeriados(lista) {
    FERIADOS = new Set();
    String(lista || "").split(/[,;\s]+/).forEach(x => {
      const p = String(x).trim().split(/[\/\-]/).map(Number);
      if (p.length === 3 && p.every(n => n > 0)) FERIADOS.add(p[2] + "-" + p[1] + "-" + p[0]);
    });
    return FERIADOS.size;
  }
  /* Feriados nacionales de Venezuela (LOTTT art. 184 y Ley de Fiestas Nacionales):
     1 ene, lunes y martes de carnaval, jueves y viernes santo, 19 abr, 1 may, 24 jun,
     5 jul, 24 jul, 12 oct, 24, 25 y 31 dic. Se calculan solos para cualquier año. */
  const FERIADOS_VE = {};
  function pascua(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mes - 1, dia);
  }
  function feriadosVenezuela(y) {
    if (FERIADOS_VE[y]) return FERIADOS_VE[y];
    const s = new Map();
    const fijo = (m, d, n) => s.set(y + "-" + m + "-" + d, n);
    fijo(1, 1, "Año Nuevo"); fijo(4, 19, "Declaración de la Independencia"); fijo(5, 1, "Día del Trabajador");
    fijo(6, 24, "Batalla de Carabobo"); fijo(7, 5, "Día de la Independencia"); fijo(7, 24, "Natalicio del Libertador");
    fijo(10, 12, "Día de la Resistencia Indígena"); fijo(12, 24, "Víspera de Navidad"); fijo(12, 25, "Navidad"); fijo(12, 31, "Fin de año");
    const p = pascua(y);
    const mov = (dias, n) => { const f = new Date(p); f.setDate(f.getDate() + dias); s.set(f.getFullYear() + "-" + (f.getMonth() + 1) + "-" + f.getDate(), n); };
    mov(-48, "Lunes de Carnaval"); mov(-47, "Martes de Carnaval"); mov(-3, "Jueves Santo"); mov(-2, "Viernes Santo");
    return (FERIADOS_VE[y] = s);
  }
  function feriadosDelMes(y, m) {
    const out = [];
    feriadosVenezuela(y).forEach((n, k) => { const p = k.split("-").map(Number); if (p[1] === m) out.push({ d: p[2], nombre: n, nacional: true }); });
    FERIADOS.forEach(k => { const p = k.split("-").map(Number); if (p[0] === y && p[1] === m && !out.some(x => x.d === p[2])) out.push({ d: p[2], nombre: "Feriado cargado en el panel", nacional: false }); });
    return out.sort((a, b) => a.d - b.d);
  }

  function esHabil(y, m, d) {
    const w = new Date(y, m - 1, d).getDay();
    const k = y + "-" + m + "-" + d;
    return w !== 0 && w !== 6 && !FERIADOS.has(k) && !feriadosVenezuela(y).has(k);
  }

  function diasHabiles(y, m) {
    const n = new Date(y, m, 0).getDate();
    let c = 0;
    for (let d = 1; d <= n; d++) if (esHabil(y, m, d)) c++;
    return c;
  }

  /* ---------- MAPEO TOLERANTE DE COLUMNAS ---------- */
  const llave = s => norm(s).replace(/[^A-Z0-9]/g, "");
  const CAMPOS = {
    sub: ["DescrSubCategoría", "DescrSubCategoria", "SubCategoría", "Subcategoria"],
    fecha: ["FechaFactura", "Fecha"],
    cli: ["CódigoCliente", "CodigoCliente", "CodCliente", "RucCliente"],
    nom: ["RazónSocial", "RazonSocial", "NombreCliente", "Cliente"],
    ruc: ["RucCliente", "RUC", "RIF", "RifCliente", "Cedula", "Cédula"],
    zona: ["DescZona", "Zona", "DescrZona"],
    vend: ["NombreVend", "Vendedor", "NombreVendedor"],
    sup: ["NombSuperv", "NombreSuperv", "Supervisor"],
    kilos: ["Kilos", "PesoNeto", "Peso Neto"],
    venta: ["PrecioTotal", "Precio Total", "Total con IVA"],
    cant: ["Cantidad", "CantidadEnUnidadInventario"],
    doc: ["NúmeroFactura", "NumeroFactura", "Documento", "NroDocumento"],
    docOrigen: ["FacturaOrigen", "DocumentoOrigen", "NúmeroFacturaOrigen", "NumeroFacturaOrigen", "DocOrigen"],
    cat: ["DescrCategoría", "DescrCategoria", "Categoría", "Categoria"],
    tipoInv: ["DescrTipoInv", "TipoInventario", "DescTipoInv"],
    prov: ["NombreProv", "Proveedor", "NombreProveedor"],
    dir: ["CódigoDirecCliente", "CodigoDirecCliente", "CodDirecCliente", "CódigoDirección", "CodigoDireccion", "CódigoDireccionCliente"]
  };
  function mapaColumnas(filas) {
    const claves = filas.length ? Object.keys(filas[0]) : [];
    const M = {};
    Object.entries(CAMPOS).forEach(([k, alts]) => {
      let hallado = null;
      for (const a of alts) { hallado = claves.find(c => llave(c) === llave(a)); if (hallado) break; }
      M[k] = hallado || null;
    });
    M.faltantes = Object.entries(M).filter(([k, v]) => k !== "faltantes" && k !== "dir" && !v).map(([k]) => k);
    return M;
  }

  /* El archivo puede declarar mal su rango: recalcular a partir de las celdas reales */
  function repararHoja(ws) {
    let maxR = 0, maxC = 0;
    Object.keys(ws).forEach(k => {
      if (k[0] === "!") return;
      const c = XLSX.utils.decode_cell(k);
      if (c.r > maxR) maxR = c.r;
      if (c.c > maxC) maxC = c.c;
    });
    ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    return { filas: maxR + 1, columnas: maxC + 1 };
  }

  /* días hábiles del 1° del mes hasta la fecha de corte (incluida) */
  function habilesHasta(y, m, d) {
    let c = 0;
    for (let i = 1; i <= d; i++) if (esHabil(y, m, i)) c++;
    return c;
  }

  /* fecha de corte: la indicada por la administración o el último día facturado */
  function corteDe(ds, corte) {
    const ult = parseFecha(ds.dias[ds.dias.length - 1]) || { y: ds.anio, m: ds.mesNum, d: 1 };
    const c = corte ? parseFecha(corte) : null;
    return (c && c.y === ds.anio && c.m === ds.mesNum) ? c : ult;
  }

  /* ---------- EMPAQUETADO: filas del Excel -> dataset compacto ---------- */
  function pack(filas, nombreArchivo) {
    const K = mapaColumnas(filas);
    const subs = [], clientes = [], zonas = [], vends = [], dias = [], supers = [], clientesNom = [], clientesRuc = [];
    const supDeVend = [];
    const iSup = new Map();
    const iSub = new Map(), iCli = new Map(), iZon = new Map(), iVen = new Map(), iDia = new Map();
    const idx = (map, arr, val) => {
      if (!map.has(val)) { map.set(val, arr.length); arr.push(val); }
      return map.get(val);
    };
    const r = [];
    const sucursales = new Set();
    let y = 0, m = 0, descartadas = 0;

    const V = (f, k, def) => (K[k] && f[K[k]] != null && f[K[k]] !== "") ? f[K[k]] : def;
    filas.forEach(f => {
      const sub = norm(V(f, "sub", ""));
      if (!sub) return;
      if (!esNestle(V(f, "cat", ""), V(f, "tipoInv", ""), V(f, "prov", ""))) { descartadas++; return; }
      const fe = parseFecha(V(f, "fecha", ""));
      const dk = fe ? `${pad(fe.d)}/${pad(fe.m)}/${fe.y}` : "s/f";
      if (fe) { y = fe.y; m = fe.m; }
      /* CódigoDirecCliente: 1 = dirección principal (primer código de la empresa); 2, 3… = sucursales.
         Cada sucursal cuenta como un cliente aparte: código "CODIGO-2" y RIF "RIF/2", que cruza con el
         "RIF-2" del maestro de clientes. */
      const dirN = parseInt(String(V(f, "dir", "")).replace(/[^0-9]/g, ""), 10) || 1;
      if (dirN > 1) sucursales.add(String(V(f, "cli", "")).trim() + "-" + dirN);
      const cIdx = idx(iCli, clientes, String(V(f, "cli", "SIN CLIENTE")).trim() + (dirN > 1 ? "-" + dirN : ""));
      if (!clientesNom[cIdx]) clientesNom[cIdx] = String(V(f, "nom", "")).trim() + (dirN > 1 ? " · sucursal " + dirN : "");
      if (!clientesRuc[cIdx]) { const rb = rifN(V(f, "ruc", "")); clientesRuc[cIdx] = rb ? rb + (dirN > 1 ? "/" + dirN : "") : ""; }
      const vIdx = idx(iVen, vends, String(V(f, "vend", "SIN VENDEDOR")).trim() || "SIN VENDEDOR");
      const sIdx = idx(iSup, supers, (String(V(f, "sup", "SIN SUPERVISOR")).trim() || "SIN SUPERVISOR").toUpperCase());
      if (supDeVend[vIdx] == null) supDeVend[vIdx] = sIdx;
      r.push([
        cIdx,
        idx(iZon, zonas, String(V(f, "zona", "SIN ZONA")).trim() || "SIN ZONA"),
        vIdx,
        idx(iSub, subs, sub),
        idx(iDia, dias, dk),
        Math.round(num(V(f, "kilos", 0)) * 1000) / 1000,
        Math.round(num(V(f, "venta", 0)) * 100) / 100,
        Math.round(num(V(f, "cant", 0))),
        tipoDocumento(V(f, "doc", ""), V(f, "docOrigen", ""))
      ]);
    });

    /* reordenar días cronológicamente y remapear */
    const orden = dias.map((d, i) => ({ d, i })).sort((a, b) => {
      const A = a.d.split("/"), B = b.d.split("/");
      return (A[2] + A[1] + A[0]).localeCompare(B[2] + B[1] + B[0]);
    });
    const remap = {}; orden.forEach((o, k) => remap[o.i] = k);
    const dias2 = orden.map(o => o.d);
    r.forEach(row => row[4] = remap[row[4]]);

    return {
      archivo: nombreArchivo || "archivo.xlsx",
      generado: new Date().toLocaleString("es-VE"), ts: Date.now(),
      mes: `${pad(m)}/${y}`, anio: y, mesNum: m, columnas: K, descartadas, sucursales: sucursales.size,
      subs, clientes, clientesNom, clientesRuc, zonas, vends, supers, supDeVend, dias: dias2, r
    };
  }

  /* ---------- CÁLCULO ---------- */
  function compute(ds, opt) {
    opt = opt || {};
    const zonaF = opt.zona && opt.zona !== "TODAS" ? ds.zonas.indexOf(opt.zona) : -1;
    const vendF = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const rows = ds.r.filter(x => (zonaF < 0 || x[1] === zonaF) && (vendF < 0 || x[2] === vendF))
      .filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);   /* regla 1 */

    const cuotasKg = Object.assign({}, CUOTAS_KG, opt.cuotasKg || {});
    const cuotaUsd = num(opt.cuotaUsd) || 0;

    const univSet = new Set(rows.map(x => x[0]));
    const sinFiltro = zonaF < 0 && vendF < 0;
    /* UN SOLO maestro: si llega el listado de RIF del maestro, el universo es ese listado y los
       activados se cuentan solo entre clientes del maestro; si no, se usa el total configurado. */
    const maeSet = (sinFiltro && opt.maestroRifs instanceof Set && opt.maestroRifs.size) ? opt.maestroRifs : null;
    const rifDe = c => rifN(ds.clientesRuc ? ds.clientesRuc[c] : "");
    const dentro = c => !maeSet || maeSet.has(rifDe(c));
    const fuera = new Set();
    const univGen = maeSet ? maeSet.size
      : ((sinFiltro && num(opt.universo) > 0) ? num(opt.universo) : (sinFiltro ? MAESTROS.general : univSet.size));
    const univConf = univGen;
    const universoDe = () => univGen;
    const universo = univGen;
    const baseNestle = univGen;

    const corte = corteDe(ds, opt.corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, corte.d) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum) || diasTrans;
    const factor = habiles / diasTrans;

    const acumula = () => ({ kilos: 0, venta: 0, unid: 0, cli: new Set() });
    const glob = acumula();
    const cliGeneral = new Set();
    const porSub = new Map();
    const porZona = new Map();
    const porVend = new Map();
    const porCli = new Map();
    const serie = ds.dias.map(d => ({ fecha: d.slice(0, 5), kilos: 0, venta: 0, cli: new Set() }));
    const serieFoco = {}; FOCO.forEach(s => serieFoco[s] = ds.dias.map(() => 0));

    rows.forEach(x => {
      const [c, z, v, s, d, kg, us, un] = x;
      const sub = ds.subs[s];
      const factura = (x[8] || 0) === TIPO_DOC.FACTURA;   /* regla 3 */
      glob.kilos += kg; glob.venta += us; glob.unid += un;
      if (factura && us > 0) { if (dentro(c)) { glob.cli.add(c); cliGeneral.add(c); } else fuera.add(rifDe(c) || ("c" + c)); }

      if (!porSub.has(sub)) porSub.set(sub, acumula());
      const S = porSub.get(sub); S.kilos += kg; S.venta += us; S.unid += un; if (factura && us > 0 && dentro(c)) S.cli.add(c);

      const zn = ds.zonas[z];
      if (!porZona.has(zn)) porZona.set(zn, acumula());
      const Z = porZona.get(zn); Z.kilos += kg; Z.venta += us; if (factura && us > 0) Z.cli.add(c);

      const vn = ds.vends[v];
      if (!porVend.has(vn)) porVend.set(vn, acumula());
      const V = porVend.get(vn); V.kilos += kg; V.venta += us; if (factura && us > 0) V.cli.add(c);

      const cn = ds.clientes[c];
      if (!porCli.has(cn)) porCli.set(cn, acumula());
      const C = porCli.get(cn); C.kilos += kg; C.venta += us;

      serie[d].kilos += kg; serie[d].venta += us; if (factura && us > 0) serie[d].cli.add(c);
      if (serieFoco[sub]) serieFoco[sub][d] += kg;
    });

    const fila = (sub) => {
      const S = porSub.get(sub) || acumula();

      const tgt = TARGETS[sub];

      return {
        cat: sub, activados: act, noActivados: Math.max(0, univ - act), universo: univ, pct: pct, target: tgt != null ? tgt : null,
        requeridos: req, faltan: req != null ? Math.max(0, req - act) : null,
        cumpl: tgt ? 100 * pct / tgt : (tgt === 0 ? 100 : null),
        kilos: S.kilos, kilosProy: S.kilos * factor,

      .map(([k, v]) => ({ [key]: k, kilos: v.kilos, venta: v.venta, clientes: v.cli ? v.cli.size : 0 }))

    const kilosFoco = foco.reduce((a, r) => a + r.kilos, 0);

        diasTrans, habiles, factor, registros: rows.length,
        corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}`,

        cumplKgProy: cuotaKg ? 100 * kilosFocoProy / cuotaKg : null,

  /* ---------- PERFORMANCE POR VENDEDOR Y SUPERVISOR ---------- */
  /* ---------- matriz oficial de activación ----------

  let OFICIAL = null;
  function setOficial(o) {
    OFICIAL = null;

    for (const f of o.filas) {
      filas.push(f);
      if (f.tipo === "total") break;                       /* lo que viene después del TOTAL no es la matriz */
      const k = norm(f.asesor);
      if (f.tipo !== "asesor" || idx[k] || !(f.cart >= 0) || !(f.act >= 0) || k === "ASESOR" || k === "VALIDACION") continue;
      idx[k] = f;

  /* la matriz oficial aplica cuando el rango va del día 1 al día de las ventas con que se armó (ventasHasta) */
  const oficialDe = ds => {

    const desde = ds.rangoDesde || 1, hasta = ds.rangoHasta || ultimo;

    return hasta === vh ? OFICIAL : null;

  /* filtro de coordinaciones: "TODOS", una sola o varias separadas por "|" */
  const supSetDe = s => { if (!s || s === "TODOS") return null; const a = String(s).split("|").map(norm).filter(Boolean); return a.length ? new Set(a) : null; };


  /* ---------- MAESTRO GENERAL DE CLIENTES ----------
     El maestro general trae todos los clientes de Venejugos. De él salen las bases del tablero:
     - cartera Nestlé del asesor = clientes con ESTATUS NESTLE = ACTIVO (por ASESOR ACTUAL)
     - base A&B = clientes con la bandera A&B · base Confites = clientes con la bandera CONFITES
     RECUPERACION queda fuera. La coordinación de cada asesor es la del panel; un asesor nuevo
     toma la de la columna SUPERVISOR del maestro. Sin maestro general se usan las bases fijas. */
  const CARTERAS_FIJAS = JSON.parse(JSON.stringify(CARTERAS));
  let BASES_MAESTRO = null;
  function carterasDesdeMaestro(clientes) {
    if (!Array.isArray(clientes) || !clientes.length || !clientes.some(c => c && c.nes !== undefined)) return null;
    const acc = {};
    clientes.forEach(c => {
      const v = norm(c.vend); if (!v || v === "RECUPERACION") return;
      const a = acc[v] || (acc[v] = { tot: 0, ab: 0, conf: 0, sups: {} });
      if (c.nes) { a.tot++; if (c.ab) a.ab++; if (c.cf) a.conf++; }
      if (c.sup) { const s = norm(c.sup); a.sups[s] = (a.sups[s] || 0) + 1; }
    });
    const cambios = [];
    Object.keys(CARTERAS).forEach(k => delete CARTERAS[k]);
    Object.keys(acc).forEach(v => {
      const a = acc[v]; if (!a.tot) return;                       /* sin cartera Nestlé: no entra al tablero */
      const supM = Object.keys(a.sups).sort((x, y) => a.sups[y] - a.sups[x])[0] || "";
      const fijo = CARTERAS_FIJAS[v];
      const sup = supM || (fijo ? fijo.sup : "SIN SUPERVISOR");   /* la coordinación es la del maestro */
      if (fijo && supM && supM !== fijo.sup) cambios.push({ v, panel: fijo.sup, maestro: supM });
      CARTERAS[v] = { ab: a.ab, conf: a.conf, tot: a.tot, sup };
    });
    Object.keys(CARTERAS_FIJAS).forEach(v => { if (!CARTERAS[v]) CARTERAS[v] = { ab: 0, conf: 0, tot: 0, sup: CARTERAS_FIJAS[v].sup }; });
    const suma = f => Object.keys(CARTERAS).reduce((s, k) => s + (CARTERAS[k][f] || 0), 0);
    MAESTROS.general = suma("ab"); MAESTROS.confites = suma("conf"); MAESTROS.nestle = suma("tot");
    indexarMaestro(clientes);
    BASES_MAESTRO = { asesores: Object.keys(acc).filter(v => acc[v].tot).length, nestle: MAESTROS.nestle, ab: MAESTROS.general, conf: MAESTROS.confites, cambios };
    return BASES_MAESTRO;
  }
  const basesMaestro = () => BASES_MAESTRO;
  /* índice del maestro general: RIF -> asesor, cartera Nestlé y banderas A&B / Confites */
  let MAE_IDX = null;
  function indexarMaestro(clientes) {
    MAE_IDX = new Map();
    clientes.forEach(c => {
      const r = rifN(c.rif), v = norm(c.vend);
      if (!r || !v || v === "RECUPERACION" || MAE_IDX.has(r)) return;
      MAE_IDX.set(r, { v, nes: c.nes !== false, ab: c.ab === true, cf: c.cf === true });
    });
  }
  const maestroIdx = () => MAE_IDX;
  /* ACTIVACIÓN SEGÚN EL MAESTRO
     - Cliente de la base del asesor en el maestro (estatus Nestlé activo y, por categoría, bandera A&B o
       Confites): cuenta para ese asesor si compró la categoría, se la haya facturado quien sea.
     - Cliente fuera de esa base (sin la bandera, sin estatus Nestlé activo o fuera del maestro) que compró
       productos Nestlé: también cuenta, para el asesor que le facturó.
     Siempre con factura mayor a cero, restando las devoluciones NCTESO. La base (el denominador) sigue
     siendo la del maestro, por eso un asesor puede pasar del 100 % de su base. */
  const ACT_CACHE = new WeakMap();

    if (ACT_CACHE.has(ds)) return ACT_CACHE.get(ds);
    const netoC = new Map(), facC = new Set(), netoT = new Map(), facT = new Set();
    ds.r.forEach(x => {

      const r = rifN(ds.clientesRuc ? ds.clientesRuc[x[0]] : "") || ("c" + x[0]), M = MAE_IDX.get(r);
      const sub = ds.subs[x[3]], vf = norm(ds.vends[x[2]]);
      const enCartera = !!M && M.nes, enBase = enCartera && (CONFITES.indexOf(sub) > -1 ? M.cf : M.ab);
      const kt = (enCartera ? M.v : vf) + "|" + r + "|" + (enCartera ? 1 : 0);
      netoT.set(kt, (netoT.get(kt) || 0) + x[6]); if (t === TIPO_DOC.FACTURA && x[6] > 0) facT.add(kt);
      const kc = sub + "|" + (enBase ? M.v : vf) + "|" + r + "|" + (enBase ? 1 : 0);
      netoC.set(kc, (netoC.get(kc) || 0) + x[6]); if (t === TIPO_DOC.FACTURA && x[6] > 0) facC.add(kc);
    });

    const poner = (m, v, r) => (m.get(v) || m.set(v, new Set()).get(v)).add(r);
    facC.forEach(kc => { if (!((netoC.get(kc) || 0) > 0.0001)) return; const [sub, v, r, b] = kc.split("|");

  }
  const actMaestro = (AM, cat, v) => { const m = cat === "TODAS" ? AM.todas : AM.porCat[cat]; const s = m && m.get(v); return s ? s.size : 0; };

  function computeVend(ds, opt) {

    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const tgt = cat === "TODAS" ? 100 : (TARGETS[cat] != null ? TARGETS[cat] : 100);
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const supS = supSetDe(opt.supervisor), supF = supS ? Array.from(supS).join("|") : null, supOk = s => !supS || supS.has(norm(s || ""));
    /* solo asesores con cartera asignada (y del supervisor elegido): el resto queda fuera del reporte */

    const filas = vFil < 0 ? ds.r.filter(x => asignados.has(x[2])) : ds.r.filter(x => x[2] === vFil);

    const corte = corteDe(ds, opt.corte);

    const ofiR = oficialDe(ds);
    const restantes = ofiR && ofiR.resta > 0 ? ofiR.resta : Math.max(1, habiles - diasTrans);   /* la matriz oficial manda: su "Resta" */
    const porDia = faltan => faltan / restantes;

    /* Con el maestro único cargado, activado = cliente del maestro con factura > 0, atribuido al asesor
       que lo tiene en el maestro (sin importar quién facturó). Así coincide con la lista de clientes. */
    const nv = n => ALIAS_VEND[norm(n)] || norm(n);
    const maeMap = null;
    const ofi = oficialDe(ds);
    const AM = activacionesMaestro(ds);      /* con el maestro general: activación según el maestro */
    const actNom = {}, actCatM = {};
    if (maeMap) ds.r.forEach(x => {
      if ((x[8] || 0) !== TIPO_DOC.FACTURA || !(x[6] > 0)) return;
      const k = rifN(ds.clientesRuc ? ds.clientesRuc[x[0]] : ""), mv = maeMap.get(k);
      if (!mv) return;
      if (cat === "TODAS" || ds.subs[x[3]] === cat) (actNom[mv] = actNom[mv] || new Set()).add(k);
      (actCatM[ds.subs[x[3]]] = actCatM[ds.subs[x[3]]] || []).push([k, mv]);
    });

    /* --- por vendedor, en la categoría seleccionada --- */
    const cartera = {}, activos = {};
    /* activado = factura mayor a cero en la categoría, restando las devoluciones NCTESO:
       si el cliente devolvió todo, no cuenta (criterio de la hoja oficial) */
    const neto = new Map(), conFac = new Set();
    filas.forEach(x => {
      const [c, z, v, s, d, kg, us] = x;
      (cartera[v] = cartera[v] || new Set()).add(c);
      if (!(cat === "TODAS" || ds.subs[s] === cat)) return;
      const tipo = x[8] || 0, k = v + "|" + c;
      if (tipo === TIPO_DOC.FACTURA || tipo === TIPO_DOC.NC_TESORERIA) neto.set(k, (neto.get(k) || 0) + us);
      if (tipo === TIPO_DOC.FACTURA && us > 0) conFac.add(k);
    });
    conFac.forEach(k => { if ((neto.get(k) || 0) > 0.0001) { const p = k.split("|"); (activos[+p[0]] = activos[+p[0]] || new Set()).add(+p[1]); } });

    const esConf = c => CONFITES.indexOf(c) > -1;
    /* En "todas las categorías" la base es el maestro Nestlé cargado en el panel
       administrativo, repartido entre los asesores en proporción a su cartera. */
    const baseCat = (C, categoria) => categoria === "TODAS" ? C.tot
      : (esConf(categoria) ? C.conf : C.ab);

    const vendedores = ds.vends.map((nom, i) => {
      const atendida = cartera[i] ? cartera[i].size : 0;
      const C = carteraDe(nom);
      const base = C ? baseCat(C, cat) : atendida;
      let act = AM ? actMaestro(AM, cat, norm(nom)) : (activos[i] ? activos[i].size : 0);
      let baseO = base;
      const fo = ofi && ofi.idx[norm(nom)];
      if (fo) {
        if (cat === "TODAS") { act = fo.act; baseO = fo.cart; }
        else { baseO = esConf(cat) ? fo.conf : fo.ab; if (fo.cats && fo.cats[cat]) act = fo.cats[cat].act; }
      }
      const meta = Math.round(baseO * tgt / 100);
      const faltan = Math.max(0, meta - act);
      return {
        vendedor: nom,
        supervisor: C ? C.sup : "SIN ASIGNACION EN CARTERA",
        asignada: !!C, atendida,
        cartera: baseO, meta, activados: act, faltan, oficial: !!fo,
        pctAct: baseO ? 100 * act / baseO : null,
        pendienteAct: baseO ? 100 * faltan / baseO : null,
        pct: meta ? 100 * act / meta : null,
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : null,
        porDia: porDia(faltan)
      };
    }).filter(v => v.asignada && supOk(v.supervisor) && (vFil < 0 || v.vendedor === ds.vends[vFil]) && (v.cartera > 0 || v.atendida > 0));
    /* asesores de la cartera sin ventas en el rango: su base cuenta igual que en la hoja */
    if (!ofi && vFil < 0) {
      const ya = new Set(vendedores.map(v => norm(v.vendedor)));
      Object.keys(CARTERAS).forEach(k => {
        const C = CARTERAS[k]; if (ya.has(norm(k)) || !supOk(C.sup)) return;
        const baseO = cat === "TODAS" ? C.tot : (esConf(cat) ? C.conf : C.ab);
        if (!baseO) return;
        const meta = Math.round(baseO * tgt / 100);
        const a0 = AM ? actMaestro(AM, cat, norm(k)) : 0, f0 = Math.max(0, meta - a0);
        vendedores.push({ vendedor: k, supervisor: C.sup, asignada: true, atendida: 0, cartera: baseO, meta, activados: a0, faltan: f0,
          pctAct: 100 * a0 / baseO, pendienteAct: 100 * f0 / baseO, pct: meta ? 100 * a0 / meta : null, pendiente: meta ? Math.max(0, 100 - 100 * a0 / meta) : null, porDia: porDia(f0) });
      });

    if (ofi && vFil < 0) {
      const ya = new Set(vendedores.map(v => norm(v.vendedor)));
      Object.keys(ofi.idx).forEach(k => {
        const fo = ofi.idx[k]; if (ya.has(k)) return;
        const sup = (CARTERAS[k] || {}).sup || norm(fo.sup || ""); if (!supOk(sup)) return;
        const baseO = cat === "TODAS" ? fo.cart : (esConf(cat) ? fo.conf : fo.ab);
        const act = cat === "TODAS" ? fo.act : (fo.cats && fo.cats[cat] ? fo.cats[cat].act : 0);
        if (!baseO && !act) return;
        const meta = Math.round(baseO * tgt / 100), faltan = Math.max(0, meta - act);
        vendedores.push({ vendedor: fo.asesor, supervisor: sup || "SIN ASIGNACION EN CARTERA", asignada: true, atendida: 0, cartera: baseO, meta, activados: act, faltan, oficial: true,
          pctAct: baseO ? 100 * act / baseO : null, pendienteAct: baseO ? 100 * faltan / baseO : null,
          pct: meta ? 100 * act / meta : null, pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : null, porDia: porDia(faltan) });
      });
    }

    const mapa = new Map();
    vendedores.forEach(v => {
      if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, { supervisor: v.supervisor, cartera: 0, meta: 0, activados: 0, equipo: [] });
      const S = mapa.get(v.supervisor);

      S.equipo.sort((a, b) => (b.pct || 0) - (a.pct || 0));

      S.pendiente = S.pct == null ? null : Math.max(0, 100 - S.pct);
      S.faltan = Math.max(0, S.meta - S.activados);   /* como la hoja: el asesor que supera su meta compensa al equipo */
      S.pctAct = S.cartera ? 100 * S.activados / S.cartera : null;
      S.pendienteAct = S.cartera ? 100 * S.faltan / S.cartera : null;

    const tot = vendedores.reduce((a, v) => ({ cartera: a.cartera + v.cartera, meta: a.meta + v.meta, activados: a.activados + v.activados }), { cartera: 0, meta: 0, activados: 0 });
    /* en la vista general la base es el maestro Nestlé; la diferencia con la suma de

    if (!tot.sinCartera) tot.meta = Math.round(tot.cartera * tgt / 100);

    tot.faltan = Math.max(0, tot.meta - tot.activados);   /* como la hoja: compensado entre equipos */
    tot.pctAct = tot.cartera ? 100 * tot.activados / tot.cartera : null;

      return a + (C ? C[tipo] : 0);
    }, 0);
    /* bases del alcance: todos los asesores de la cartera (también los que no tienen ventas), como la hoja */
    const carterasAlcance = vFil < 0 ? Object.keys(CARTERAS).filter(k => supOk(CARTERAS[k].sup)).map(k => CARTERAS[k])
                                     : [carteraDe(ds.vends[vFil])].filter(Boolean);
    const sumaC = tipo => carterasAlcance.reduce((a, C) => a + (C[tipo] || 0), 0);
    const baseAB = sumaC("ab") || sumaBase("ab") || new Set(filas.map(x => x[0])).size;
    const baseConf = sumaC("conf") || sumaBase("conf") || baseAB;
    const baseTot = sumaC("tot") || sumaBase("tot") || baseAB;
    const carteraTotal = Math.max(baseAB, baseConf);
    /* activados por categoría = suma de los activados de cada asesor (cliente con factura > 0, NCTESO restando) */
    const netoC = new Map(), facC = new Set();
    filas.forEach(x => {
      const tipo = x[8] || 0; if (tipo !== TIPO_DOC.FACTURA && tipo !== TIPO_DOC.NC_TESORERIA) return;
      const k = ds.subs[x[3]] + "|" + x[2] + "|" + x[0];
      netoC.set(k, (netoC.get(k) || 0) + x[6]);
      if (tipo === TIPO_DOC.FACTURA && x[6] > 0) facC.add(k);
    });
    const actCat = {};
    let baseOfiAB = 0, baseOfiConf = 0;
    if (AM) {
      const alc = new Set(vFil < 0 ? Object.keys(CARTERAS).filter(k => supOk(CARTERAS[k].sup)) : [norm(ds.vends[vFil])]);
      Object.keys(AM.porCat).forEach(sub => { let n = 0; AM.porCat[sub].forEach((s, v) => { if (alc.has(v)) n += s.size; }); actCat[sub] = n; });
    }
    if (!AM) facC.forEach(k => { if ((netoC.get(k) || 0) > 0.0001) { const sub = k.slice(0, k.indexOf("|")); actCat[sub] = (actCat[sub] || 0) + 1; } });
    /* con la matriz oficial del mes, los activados por categoría son los suyos */
    if (ofi) {
      const filasO = Object.keys(ofi.idx).map(k => ofi.idx[k])
        .filter(f => vFil < 0 ? supOk((CARTERAS[norm(f.asesor)] || {}).sup || f.sup) : norm(f.asesor) === norm(ds.vends[vFil]));
      (ofi.categorias || []).forEach(c => { actCat[c.cat] = filasO.reduce((a, f) => a + (f.cats && f.cats[c.cat] ? f.cats[c.cat].act : 0), 0); });
      baseOfiAB = filasO.reduce((a, f) => a + (f.ab || 0), 0); baseOfiConf = filasO.reduce((a, f) => a + (f.conf || 0), 0);
    }

    const porCategoria = Object.keys(TARGETS).map(c => {
      const target = TARGETS[c];
      const act = actCat[c] || 0;
      const baseCategoria = ofi && (ofi.categorias || []).some(x => x.cat === c) ? (CONFITES.indexOf(c) > -1 ? baseOfiConf : baseOfiAB) : (CONFITES.indexOf(c) > -1 ? baseConf : baseAB);
      const meta = Math.round(baseCategoria * target / 100);
      const faltan = Math.max(0, meta - act);
      return {
        cat: c, target, cartera: baseCategoria, meta, activados: act, faltan,
        pctCartera: baseCategoria ? 100 * act / baseCategoria : 0,
        pct: meta ? 100 * act / meta : (target === 0 ? 100 : null),
        pendiente: meta ? Math.max(0, 100 - 100 * act / meta) : 0,
        porDia: porDia(faltan)
      };
    });

    return {
      categoria: cat, target: tgt, vendedor: opt.vendedor || "TODOS", supervisor: supF || "TODOS",
      supervisores, vendedores, porCategoria, total: tot,
      bases: { ab: baseAB, confites: baseConf, total: baseTot, nestle: baseNestle },
      dias: { transcurridos: diasTrans, habiles, restantes, corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}` },
      meta: { archivo: ds.archivo, desde: ds.dias[0], hasta: ds.dias[ds.dias.length - 1], mes: ds.mes }
    };
  }

  /* ---------- CLIENTES ACTIVADOS ---------- */
  /* Activado = el cliente registra un monto mayor a cero en la categoría evaluada. */
  function clientesDe(ds, opt) {
    opt = opt || {};
    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const vFil = opt.vendedor && opt.vendedor !== "TODOS" ? ds.vends.indexOf(opt.vendedor) : -1;
    const supS = supSetDe(opt.supervisor), supF = supS ? Array.from(supS).join("|") : null, supOk = s => !supS || supS.has(norm(s || ""));
    const asignados = new Set(ds.vends.map((n, i) => { const C = carteraDe(n); return C && supOk(C.sup) ? i : -1; }).filter(i => i >= 0));
    const filas = (vFil < 0 ? ds.r.filter(x => asignados.has(x[2])) : ds.r.filter(x => x[2] === vFil))
      .filter(x => (x[8] || 0) !== TIPO_DOC.NC_TESORERIA);

    const mapa = new Map();
    filas.forEach(x => {
      const [c, z, v, s, d, kg, us] = x;
      if (!mapa.has(c)) mapa.set(c, {
        codigo: ds.clientes[c], nombre: (ds.clientesNom || [])[c] || ds.clientes[c],
        ruc: (ds.clientesRuc || [])[c] || "",
        vendedor: ds.vends[v], zona: ds.zonas[z],
        supervisor: (carteraDe(ds.vends[v]) || {}).sup || "SIN ASIGNACION",
        monto: 0, kilos: 0, montoTotal: 0, dia: -1, facturas: 0, conFactura: false
      });
      const C = mapa.get(c);
      C.montoTotal += us;
      if (cat === "TODAS" || ds.subs[s] === cat) {
        C.monto += us; C.kilos += kg;
        if ((x[8] || 0) === TIPO_DOC.FACTURA) {
          C.facturas++;
          if (us > 0) C.conFactura = true;          /* regla 3 */
          if (d > C.dia) C.dia = d;
        }
      }
    });

    const lista = Array.from(mapa.values()).map(C => {
      C.activado = C.conFactura;
      C.ultima = C.dia >= 0 ? ds.dias[C.dia] : "—";
      return C;
    }).sort((a, b) => b.monto - a.monto || a.nombre.localeCompare(b.nombre));

    return {
      categoria: cat, vendedor: opt.vendedor || "TODOS", lista,
      activados: lista.filter(c => c.activado).length,
      atendidos: lista.length,
      kilos: lista.reduce((a, c) => a + c.kilos, 0),
      monto: lista.reduce((a, c) => a + c.monto, 0)
    };
  }

  /* ---------- CLIENTES: ACTIVADOS Y NO ACTIVADOS (regla de la matriz de la coordinación) ----------
     Activado = cliente al que el asesor le facturó la categoría con monto mayor a cero, restando las
     devoluciones NCTESO (si devolvió todo no cuenta), esté o no en el maestro. Cada sucursal es un cliente.
     No activado = cliente del maestro de ese asesor al que él no le ha facturado la categoría. */
  function clientesMae(ds, clientesMaestro, opt) {
    opt = opt || {};
    const cat = opt.categoria && opt.categoria !== "TODAS" ? norm(opt.categoria) : "TODAS";
    const vNom = opt.vendedor && opt.vendedor !== "TODOS" ? norm(opt.vendedor) : null;
    const supS = supSetDe(opt.supervisor), supOk = s => !supS || supS.has(norm(s || ""));
    const enAlcance = v => { const C = CARTERAS[v]; return !!C && supOk(C.sup) && (!vNom || v === vNom); };
    const regla = !!MAE_IDX;
    /* ventas por asesor que factura y cliente (RIF canónico con sucursal) */
    const ventas = new Map();
    ds.r.forEach(x => {
      const tipo = x[8] || 0;
      if (tipo !== TIPO_DOC.FACTURA && tipo !== TIPO_DOC.NC_TESORERIA) return;
      if (!(cat === "TODAS" || ds.subs[x[3]] === cat)) return;
      const v = norm(ds.vends[x[2]]);
      if (!regla && !enAlcance(v)) return;
      const r = rifN(ds.clientesRuc ? ds.clientesRuc[x[0]] : "") || ("c" + x[0]);
      const k = v + "|" + r;
      let V = ventas.get(k);
      if (!V) ventas.set(k, V = { v, r, c: x[0], neto: 0, monto: 0, kilos: 0, facturas: 0, dia: -1, conFactura: false, nc: 0 });
      V.neto += x[6];
      if (tipo === TIPO_DOC.NC_TESORERIA) { V.nc += x[6]; return; }
      V.monto += x[6]; V.kilos += x[5]; V.facturas++;
      if (x[6] > 0) V.conFactura = true;
      if (x[4] > V.dia) V.dia = x[4];
    });


    /* con el maestro general: su base (activados y no activados) y, además, los clientes fuera de su base
       a los que el asesor les vendió productos Nestlé de la categoría (cuentan como activados) */
    const AMx = activacionesMaestro(ds);
    if (AMx && MAE_IDX) {
      const vendBase = (M) => M.nes && (cat === "TODAS" || (CONFITES.indexOf(cat) > -1 ? M.cf : M.ab));
      const lista2 = [];
      const datos = new Map(); ventas.forEach(V => { const D0 = datos.get(V.r) || { monto: 0, kilos: 0, facturas: 0, dia: -1, c: V.c, vs: new Set(), conFactura: false }; D0.monto += V.monto; D0.kilos += V.kilos; D0.facturas += V.facturas; if (V.dia > D0.dia) D0.dia = V.dia; if (V.conFactura) { D0.conFactura = true; D0.vs.add(V.v); } datos.set(V.r, D0); });
      const nombres = new Map(); (Array.isArray(clientesMaestro) ? clientesMaestro : []).forEach(c => { const k = rifN(c.rif); if (k && !nombres.has(k)) nombres.set(k, c); });
      const m = cat === "TODAS" ? AMx.todas : AMx.porCat[cat], mf = cat === "TODAS" ? AMx.fuera.todas : AMx.fuera.porCat[cat];
      const fila = (r, v, activ, nota) => {
        const D0 = datos.get(r), c0 = nombres.get(r) || {};
        return { ruta: c0.ruta || "", tipo: c0.tipo || "", codigo: D0 ? ds.clientes[D0.c] : "", nombre: String(c0.nom || (D0 ? (ds.clientesNom || [])[D0.c] : "") || "").trim(), ruc: r, vendedor: v,
          supervisor: (CARTERAS[v] || {}).sup || "SIN ASIGNACION", diaVisita: c0.dia || "", monto: D0 ? D0.monto : 0, kilos: D0 ? D0.kilos : 0, montoTotal: D0 ? D0.monto : 0,
          facturas: D0 ? D0.facturas : 0, dia: D0 ? D0.dia : -1, ultima: D0 && D0.dia >= 0 ? ds.dias[D0.dia] : "—", conFactura: activ, activado: activ, nota };
      };
      MAE_IDX.forEach((M, r) => {
        if (!enAlcance(M.v) || !vendBase(M)) return;
        const activ = !!(m && m.get(M.v) && m.get(M.v).has(r)), D0 = datos.get(r);
        const otros = D0 ? Array.from(D0.vs).filter(v => v !== M.v) : [];
        lista2.push(fila(r, M.v, activ, activ && otros.length ? "facturó " + otros.join(", ") : (!activ && D0 && D0.conFactura ? "devolvió lo comprado (NCTESO)" : "")));
      });
      let fueraB = 0;
      if (mf) mf.forEach((set, v) => { if (!enAlcance(v)) return; set.forEach(r => {
        const M = MAE_IDX.get(r);
        const por = !M ? "fuera del maestro" : !M.nes ? "sin estatus Nestlé activo" + (M.v !== v ? " · del maestro de " + M.v : "")
                  : M.v !== v ? "del maestro de " + M.v + ", sin la bandera de la categoría" : "sin la bandera " + (CONFITES.indexOf(cat) > -1 ? "Confites" : "A&B");
        fueraB++; lista2.push(fila(r, v, true, "fuera de la base · " + por));
      }); });
      lista2.sort((a, b) => (a.activado - b.activado) || (b.monto - a.monto) || a.nombre.localeCompare(b.nombre, "es"));
      const act2 = lista2.filter(c => c.activado).length;
      return { categoria: cat, vendedor: opt.vendedor || "TODOS", lista: lista2, usaMaestro: true, maestro: lista2.length - fueraB, reglaMaestro: true,
        activados: act2, noActivados: lista2.length - act2, atendidos: lista2.length, fueraMaestro: fueraB, conObservacion: lista2.filter(c => c.activado && c.nota).length,
        kilos: lista2.reduce((a, c) => a + c.kilos, 0), monto: lista2.reduce((a, c) => a + c.monto, 0) };
    }
    /* maestro: asesor de cada cliente */
    const mae = new Map();
    (Array.isArray(clientesMaestro) ? clientesMaestro : []).forEach(c => {
      const k = rifN(c.rif); if (!k || mae.has(k)) return;
      const vend = norm(c.vend) === "DIRECTO" ? "DIRECTO OFICINA" : norm(c.vend);
      if (vend === "RECUPERACION") return;
      mae.set(k, { vend, nom: String(c.nom || "").trim(), dia: c.dia || "", nes: c.nes !== false, ab: c.ab, cf: c.cf, ruta: c.ruta || "", tipo: c.tipo || "" });
    });
    const usaMaestro = mae.size > 0;
    let conObs = 0;
    const lista = [], activ = new Set();
    let fuera = 0;
    ventas.forEach(V => {
      if (!V.conFactura || !(V.neto > 0.0001)) return;          /* sin factura positiva o devolvió todo */
      const M = mae.get(V.r);
      /* validación con el maestro general: el cliente cuenta igual (regla de la matriz), pero se señala */
      const obs = [];
      if (usaMaestro) {
        if (!M) obs.push("fuera del maestro");
        else {
          if (M.vend !== V.v) obs.push("del maestro de " + M.vend);
          if (!M.nes) obs.push("sin estatus Nestlé activo");
          else if (cat !== "TODAS" && (CONFITES.indexOf(cat) > -1 ? M.cf === false : M.ab === false)) obs.push("sin bandera " + (CONFITES.indexOf(cat) > -1 ? "Confites" : "A&B"));
        }
      }
      const nota = obs.join(" · ");
      if (usaMaestro && !M) fuera++;
      if (nota) conObs++;
      activ.add(V.v + "|" + V.r);
      lista.push({ ruta: M ? M.ruta : "", tipo: M ? M.tipo : "", codigo: ds.clientes[V.c] || "", nombre: (M && M.nom) || (ds.clientesNom || [])[V.c] || "", ruc: V.r, vendedor: V.v,
        supervisor: (CARTERAS[V.v] || {}).sup || "SIN ASIGNACION", diaVisita: M ? M.dia : "", monto: V.monto, kilos: V.kilos, montoTotal: V.monto,
        facturas: V.facturas, dia: V.dia, ultima: V.dia >= 0 ? ds.dias[V.dia] : "—", conFactura: true, activado: true, nota, nc: V.nc });
    });
    /* no activados: clientes del maestro de cada asesor del alcance sin compra suya en la categoría */
    let enMaestro = 0;
    mae.forEach((M, k) => {
      if (!enAlcance(M.vend) || !M.nes) return;      /* solo su cartera Nestlé */
      if (cat !== "TODAS" && (CONFITES.indexOf(cat) > -1 ? M.cf === false : M.ab === false)) return;   /* base de la categoría */
      enMaestro++;
      if (activ.has(M.vend + "|" + k)) return;
      const V = ventas.get(M.vend + "|" + k);
      lista.push({ ruta: M.ruta, tipo: M.tipo, codigo: V ? ds.clientes[V.c] : "", nombre: M.nom, ruc: k, vendedor: M.vend, supervisor: (CARTERAS[M.vend] || {}).sup || "SIN ASIGNACION",
        diaVisita: M.dia, monto: V ? V.monto : 0, kilos: V ? V.kilos : 0, montoTotal: V ? V.monto : 0, facturas: V ? V.facturas : 0,
        dia: V ? V.dia : -1, ultima: V && V.dia >= 0 ? ds.dias[V.dia] : "—", conFactura: false, activado: false,
        nota: V && V.conFactura ? "devolvió lo comprado (NCTESO)" : "", nc: V ? V.nc : 0 });
    });
    lista.sort((a, b) => (a.activado - b.activado) || (b.monto - a.monto) || a.nombre.localeCompare(b.nombre, "es"));
    const act = lista.filter(c => c.activado).length;
    const base = usaMaestro ? enMaestro : act;
    return { categoria: cat, vendedor: opt.vendedor || "TODOS", lista, usaMaestro, maestro: base,
      activados: act, noActivados: lista.length - act, atendidos: lista.length, fueraMaestro: fuera, conObservacion: conObs,
      kilos: lista.reduce((a, c) => a + c.kilos, 0), monto: lista.reduce((a, c) => a + c.monto, 0) };
  }

  /* ---------- ROLLING NESTLÉ EN KILOS ---------- */
  function rolling(ds, opt) {
    opt = opt || {};
    const corte = corteDe(ds, opt.corte);
    const diasTrans = habilesHasta(ds.anio, ds.mesNum, corte.d) || 1;
    const habiles = diasHabiles(ds.anio, ds.mesNum) || diasTrans;
    const restantes = Math.max(1, habiles - diasTrans);
    const tt = diasTrans / habiles;                       /* tiempo transcurrido */
    const diaCorte = ds.dias.indexOf(`${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}`);

    /* el rolling de kilos incluye a todos los vendedores: mide la venta total de Venejugos */
    const mes = {}, dia = {};
    ds.r.forEach(x => {
      if ((x[8] || 0) === TIPO_DOC.NC_TESORERIA) return;
      mes[x[2]] = (mes[x[2]] || 0) + x[5];
      if (x[4] === diaCorte) dia[x[2]] = (dia[x[2]] || 0) + x[5];
    });

    const vendedores = ds.vends.map((nom, i) => {
      if (!mes[i] && !CUOTAS_VEND_KG[ALIAS_VEND[norm(nom)] || norm(nom)]) return null;
      const cuota = CUOTAS_VEND_KG[ALIAS_VEND[norm(nom)] || norm(nom)] || 0;
      const venta = mes[i] || 0;
      const proy = venta / tt;
      const falta = Math.max(0, cuota - venta);
      return {
        vendedor: nom,
        supervisor: (carteraDe(nom) || {}).sup || "SIN CARTERA ASIGNADA",
        cuota, ventaDia: dia[i] || 0, venta,
        cumpl: cuota ? 100 * venta / cuota : null,
        necesidad: cuota ? falta / restantes : 0,
        proyeccion: proy,
        cumplProy: cuota ? 100 * proy / cuota : null,
        falta
      };
    }).filter(Boolean).filter(v => { const S = supSetDe(opt.supervisor); return !S || S.has(norm(v.supervisor)); });

    const suma = arr => arr.reduce((a, v) => ({
      cuota: a.cuota + v.cuota, ventaDia: a.ventaDia + v.ventaDia, venta: a.venta + v.venta,
      necesidad: a.necesidad + v.necesidad, proyeccion: a.proyeccion + v.proyeccion, falta: a.falta + v.falta
    }), { cuota: 0, ventaDia: 0, venta: 0, necesidad: 0, proyeccion: 0, falta: 0 });

    const mapa = new Map();
    vendedores.forEach(v => {
      if (!mapa.has(v.supervisor)) mapa.set(v.supervisor, []);
      mapa.get(v.supervisor).push(v);
    });
    const supervisores = Array.from(mapa.entries()).map(([sup, equipo]) => {
      const S = suma(equipo);
      S.supervisor = sup; S.equipo = equipo;
      S.cumpl = S.cuota ? 100 * S.venta / S.cuota : null;
      S.cumplProy = S.cuota ? 100 * S.proyeccion / S.cuota : null;
      return S;
    }).sort((a, b) => (b.cumpl || 0) - (a.cumpl || 0));

    const total = suma(vendedores);
    total.cumpl = total.cuota ? 100 * total.venta / total.cuota : null;
    total.cumplProy = total.cuota ? 100 * total.proyeccion / total.cuota : null;

    return {
      vendedores, supervisores, total,
      dias: { transcurridos: diasTrans, habiles, restantes, tt: 100 * tt,
              corte: `${String(corte.d).padStart(2,"0")}/${String(corte.m).padStart(2,"0")}/${corte.y}` }
    };
  }

  /* ---------- CARGA DEL DATASET ----------
     Orden: siempre primero dataset.json del repositorio, sin caché.
     localStorage solo si la descarga falla (archivo abierto sin servidor). */
  const leerLocal = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };

  /* Dirección directa del archivo en GitHub (raw), deducida de la página publicada en GitHub Pages.
     Sirve de respaldo cuando Pages responde 404 mientras republica el sitio o desde un teléfono
     que conserva una copia vieja. */
  function urlRaw(nombre) {
    try {
      const m = /^([^.]+)\.github\.io$/i.exec(location.hostname);
      if (!m) return null;
      const seg = location.pathname.split("/").filter(Boolean);
      const repo = seg.length > 1 ? seg[0] : (seg.length === 1 && !/\.html?$/i.test(seg[0]) ? seg[0] : m[1] + ".github.io");
      return "https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/main/" + nombre;
    } catch (e) { return null; }
  }
  async function traerJSON(nombre, intentos) {
    const fuentes = [nombre], raw = urlRaw(nombre);
    if (raw) fuentes.push(raw);
    let error = null;
    for (const u of fuentes) {
      const n = u === nombre ? (intentos || 3) : 2;
      for (let i = 0; i < n; i++) {
        try {
          const res = await fetch(u + "?v=" + Date.now(), { cache: "no-store" });
          if (res.ok) return { json: await res.json(), via: u === nombre ? "repositorio" : "repositorio (respaldo directo de GitHub)", error: null };
          error = nombre + " respondió " + res.status;
        } catch (e) { error = e.message; }
        if (i < n - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
      }
    }
    return { json: null, via: "", error };
  }

  async function cargarDataset(base) {
    const r = await traerJSON("dataset.json");
    let error = r.error;
    if (r.json) {
      if (r.json.r) return { ds: r.json, origen: r.via, error: null };
      error = "dataset.json no tiene el formato esperado";
    }
    const local = leerLocal("vj_dataset");
    if (local && local.r) return { ds: local, origen: "navegador", error };
    return { ds: base, origen: "archivo base", error };
  }

  function sello(ds, origen) {
    return `${ds.archivo || "sin archivo"} · ${ds.publicado || ds.generado || "sin fecha"} · ${origen}`;
  }

  /* ---------- AVANCE SEMANAL Y DÉFICIT PROGRESIVO ----------
     La cuota del mes se divide entre la cantidad de semanas del mes en curso.
     Semana = bloque de lunes a viernes; la meta acumulada de la semana k es
     cuota x k / semanas, y el déficit es lo que falta contra esa meta. */
  function semanasDelMes(y, m) {
    const n = new Date(y, m, 0).getDate();
    const sem = [];
    let actual = null;
    for (let d = 1; d <= n; d++) {

  function semanaDeDia(sem, y, m, d) {
    const w = new Date(y, m - 1, d).getDay(), lunes = d - ((w + 6) % 7);

  }

  function semanal(ds, opt) {

    const esConf = CONFITES.indexOf(cat) > -1;

    /* día del mes de cada índice de fecha del dataset */
    const diaDelMes = ds.dias.map(f => parseInt(String(f).split("/")[0], 10));
    const semanaDe = d => semanaDeDia(sem, ds.anio, ds.mesNum, diaDelMes[d]);
    const semActual = semanaDeDia(sem, ds.anio, ds.mesNum, corte.d);
    /* la meta se reparte según los días hábiles de cada semana, no en partes iguales */
    const habMes = diasHabiles(ds.anio, ds.mesNum) || 1;

    const maeMap = mapaMaestro(opt.maestro), cliM = {};
    const nvS = n => ALIAS_VEND[norm(n)] || norm(n);

      const k = semanaDe(d);
      porVend[nom].kilos[k] += kg;
      if ((x[8] || 0) === TIPO_DOC.FACTURA && us > 0 && (cat === "TODAS" || ds.subs[s] === cat)) {
        if (!maeMap) porVend[nom].cli[k].add(c);
        else {
          const rk = rifN(ds.clientesRuc ? ds.clientesRuc[c] : ""), mv = maeMap.get(rk);
          if (mv) { const q = cliM[mv] = cliM[mv] || sem.map(() => new Set()); q[k].add(rk); }
        }
      }
    });

    const filas = Object.keys(porVend).map(nom => {
      const C = carteraDe(nom);
      if (!C) return null;
      const base = cat === "TODAS" ? C.tot : (esConf ? C.conf : C.ab);
